<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QS Marista 402 · Check-in online</title>
<meta name="theme-color" content="#141210">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --creme:#F5F0E7; --creme-2:#FFFDF8; --papel:#FAF7F1;
  --tinta:#1F1C19; --tinta-2:#665E55; --tinta-3:#9A9189;
  --laranja:#B08633; --laranja-cl:#D9B05F; --laranja-bg:#F7EFDF; --laranja-esc:#8A661F;
  --linha:#E9E1D3; --verde:#1FAA53; --verde-esc:#178C43; --alerta:#A81F2B;
  --hero-bg:#141210;
  --r:20px;
  --s1:0 1px 2px rgba(31,28,25,.05);
  --s2:0 2px 6px rgba(31,28,25,.05), 0 10px 26px rgba(31,28,25,.06);
  --s3:0 4px 12px rgba(31,28,25,.07), 0 22px 50px rgba(31,28,25,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:Manrope,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.6;padding-bottom:120px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.12;margin:0;letter-spacing:-.015em}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:660px;margin:0 auto;padding:0 20px}

.lang{position:fixed;top:0;left:0;right:0;z-index:80;transition:background .3s,border-color .3s;
  border-bottom:1px solid transparent}
.lang.solto{background:rgba(251,247,242,.94);backdrop-filter:blur(14px);border-bottom-color:var(--linha)}
.lang .wrap{display:flex;justify-content:flex-end;gap:5px;
  padding:calc(10px + env(safe-area-inset-top)) 20px 10px}
.lang button{padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.1em;
  color:rgba(255,255,255,.72);border:1px solid transparent;transition:.2s}
.lang button.on{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.34)}
.lang.solto button{color:var(--tinta-3)}
.lang.solto button.on{background:var(--tinta);color:var(--creme);border-color:var(--tinta)}

/* ---------- capa (hero) ---------- */
.hero{position:relative;min-height:54vh;display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;background:#12100E}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 58%;transform:scale(1.04)}
.hero .veu{position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(18,16,14,.58) 0%,rgba(18,16,14,.22) 30%,rgba(18,16,14,.80) 76%,#15120F 90%,var(--papel) 100%)}
.hero .in{position:relative;padding:0 24px 84px;max-width:660px;margin:0 auto;width:100%;text-align:center}
.hero .marca{position:absolute;top:calc(15px + env(safe-area-inset-top));left:20px;z-index:6;
  width:70px;opacity:.92;filter:drop-shadow(0 2px 10px rgba(0,0,0,.55))}
.hero .fio{width:38px;height:1px;background:rgba(255,255,255,.45);margin:0 auto 16px}
.hero .rot{font-size:10.5px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
  color:rgba(255,255,255,.66);margin-bottom:11px}
.hero h1{font-size:clamp(32px,9vw,46px);font-weight:600;color:#fff;line-height:1.04;
  text-shadow:0 3px 30px rgba(0,0,0,.42)}
.hero .sub{color:rgba(255,255,255,.78);font-size:14px;margin-top:11px;letter-spacing:.02em}
/* cartao do wizard sobe por cima do hero */
.painel{position:relative;z-index:5;margin:-44px 0 0;background:var(--creme-2);border:1px solid var(--linha);
  border-radius:var(--r);box-shadow:var(--s3);padding:20px 18px 22px}
@media(max-width:430px){.painel{padding:18px 15px 20px}}

/* progresso */
.prog{display:flex;gap:6px;margin:24px 0 6px}
.prog div{flex:1;height:5px;border-radius:999px;background:var(--linha);transition:background .25s}
.prog div.on{background:var(--laranja)}
.passo{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--laranja);margin-bottom:16px}

.etapa{display:none}
.etapa.on{display:block;animation:sobe .24s ease}
@keyframes sobe{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.etapa h2{font-size:clamp(23px,6vw,30px);margin-bottom:6px}
.etapa .lead{color:var(--tinta-2);font-size:14.5px;margin:0 0 20px}

.campo{margin-bottom:14px}
.campo label{display:block;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tinta-2);margin-bottom:6px}
.campo input,.campo select{width:100%;padding:14px 15px;border:1px solid var(--linha);border-radius:13px;
  background:var(--papel);font-family:inherit;font-size:16px;outline:none;color:var(--tinta)}
.campo input:focus,.campo select:focus{border-color:var(--laranja)}
.campo input.erro{border-color:var(--alerta);background:#FEF3F0}
.campo .msg{font-size:12.5px;color:var(--alerta);margin-top:5px;display:none}
.campo.mal .msg{display:block}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:430px){.dois{grid-template-columns:1fr}}

.hosp{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:16px;
  margin-bottom:12px;box-shadow:var(--s1);position:relative}
.hosp .cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hosp .cab b{font-family:Fraunces;font-size:16px;font-weight:600}
.hosp .rm{font-size:12px;font-weight:700;color:var(--alerta)}
.addh{width:100%;padding:14px;border:1.5px dashed var(--laranja-cl);border-radius:14px;color:var(--laranja);
  font-weight:800;font-size:14.5px;background:var(--laranja-bg)}
.lim{font-size:12.5px;color:var(--tinta-2);margin-top:9px;text-align:center}

.ac{border:1px solid var(--linha);border-radius:14px;background:var(--papel);margin-bottom:9px;overflow:hidden;
  transition:border-color .2s,box-shadow .2s}
.ac.on{border-color:var(--laranja-cl);box-shadow:var(--s1)}
.ac>button{width:100%;text-align:left;padding:14px 15px;font-weight:700;display:flex;justify-content:space-between;
  align-items:center;gap:12px;font-size:14.5px}
.ac>button i{font-style:normal;color:var(--laranja);transition:transform .2s;flex:none}
.ac.on>button i{transform:rotate(45deg)}
.ac .corpo{display:none;padding:0 15px 15px;color:var(--tinta-2);font-size:14px}
.ac.on .corpo{display:block}
.ac .corpo p{margin:0 0 8px}
.ac .corpo p:last-child{margin:0}

.decl{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:6px 16px;
  margin-bottom:14px;box-shadow:var(--s1)}
.decl label{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--linha);
  font-size:14.5px;cursor:pointer}
.decl label:last-child{border-bottom:0}
.decl input{width:21px;height:21px;accent-color:var(--laranja);flex:none;margin-top:1px}
.decl.mal{border-color:var(--alerta)}

.assin{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:16px;
  box-shadow:var(--s1);margin-bottom:14px}
.assin canvas{width:100%;height:170px;border:1px dashed var(--laranja-cl);border-radius:12px;
  background:#fff;touch-action:none;display:block}
.assin .barra{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
  font-size:12.5px;color:var(--tinta-2)}
.assin .limpar{font-weight:800;color:var(--laranja)}

.resumo{background:var(--laranja-bg);border:1px solid var(--laranja-cl);border-radius:16px;padding:16px;margin-bottom:16px}
.resumo h3{font-size:16px;margin-bottom:9px}
.resumo dl{margin:0;font-size:14px}
.resumo dt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);margin-top:9px}
.resumo dd{margin:2px 0 0}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,253,250,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--linha);
  padding:11px 12px calc(11px + env(safe-area-inset-bottom))}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.nav button{flex:1;padding:16px;border-radius:14px;font-weight:800;letter-spacing:.03em}
.nav .volta{border:1.5px solid var(--linha);color:var(--tinta-2);flex:0 0 34%}
.nav .segue{background:var(--laranja);color:#fff}
.nav .enviar{background:var(--verde);color:#fff}
.nav button[disabled]{opacity:.55}

.ok{text-align:center;padding:40px 0}
.ok .tick{width:78px;height:78px;border-radius:50%;background:var(--verde);color:#fff;font-size:40px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.ok h2{font-size:28px;margin-bottom:10px}
.ok p{color:var(--tinta-2);margin:0 0 22px}
.ok a{display:block;padding:16px;border-radius:14px;background:var(--laranja);color:#fff;
  text-decoration:none;font-weight:800;margin-bottom:11px}
.ok a.linha{background:none;border:1.5px solid var(--tinta);color:var(--tinta)}
.rodape{text-align:center;padding:30px 20px 6px;margin:30px 0 0;
  color:var(--tinta-3);font-size:11.5px;letter-spacing:.06em}
.rodape::before{content:'';display:block;width:46px;height:1px;background:var(--linha);margin:0 auto 24px}
.rodape img{width:104px;height:auto;opacity:.92;display:block;margin:0 auto 10px}
.hide{display:none!important}

/* ---------- barra de aviso: substitui o alert nativo, que trava a webview do Airbnb ---------- */
#aviso{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:999;
  background:var(--alerta);color:#fff;border-radius:14px;padding:13px 16px;font-size:14.5px;
  font-weight:600;line-height:1.35;box-shadow:0 10px 28px rgba(0,0,0,.28);
  opacity:0;transform:translateY(-14px);pointer-events:none;transition:opacity .2s,transform .2s}
#aviso.on{opacity:1;transform:translateY(0)}
</style>
</head>

function T(k){ return (TXT[L]&&TXT[L][k]!=null)?TXT[L][k]:TXT.pt[k]; }

/* ================= WHATSAPP ================= */
function abrirWhats(waUrl){
  var app = waUrl.replace('https://wa.me/','whatsapp://send?phone=').replace('?text=','&text=');
  var t = setTimeout(function(){ if(!document.hidden) window.location.href = waUrl; }, 1500);
  document.addEventListener('visibilitychange', function h(){
    if(document.hidden){ clearTimeout(t); document.removeEventListener('visibilitychange', h); }
  });
  window.location.href = app;
}
function zap(txt){ abrirWhats('https://wa.me/'+WHATS+'?text='+encodeURIComponent(txt)); }

/* ================= HOSPEDES ================= */
function montarHospedes(){
  var box = document.getElementById('hospedes');
  var vals = [];
  for(var i=0;i<NH;i++){
    var n=document.getElementById('h_nome_'+i), c=document.getElementById('h_cpf_'+i);
    vals.push({n:n?n.value:'', c:c?c.value:''});
  }
  var h='';
  for(var i=0;i<NH;i++){
    h+='<div class="hosp"><div class="cab"><b>'+(i===0?T('titularTit'):T('hospTit')+' '+(i+1))+'</b>'+
       (i>0?'<button class="rm" onclick="rmHosp('+i+')">'+T('remover')+'</button>':'')+'</div>'+
       '<div class="campo" id="c_h_nome_'+i+'"><label>'+T('lNome')+'</label>'+
       '<input type="text" id="h_nome_'+i+'" autocomplete="name" placeholder="'+T('phNome')+'" value="'+(vals[i].n||'').replace(/"/g,'&quot;')+'">'+
       '<div class="msg">'+T('errNome')+'</div></div>'+
       '<div class="campo" id="c_h_cpf_'+i+'"><label>'+T('lCpf')+'</label>'+
       '<input type="text" id="h_cpf_'+i+'" inputmode="numeric" placeholder="'+T('phCpf')+'" value="'+(vals[i].c||'').replace(/"/g,'&quot;')+'">'+
       '<div class="msg">'+T('errCpf')+'</div></div></div>';
  }
  box.innerHTML=h;
  document.querySelector('.addh').style.display = NH>=CAPACIDADE ? 'none' : '';
}
function addHosp(){ if(NH<CAPACIDADE){ NH++; montarHospedes(); } }
function rmHosp(i){
  var vals=[];
  for(var k=0;k<NH;k++){ if(k===i) continue;
    vals.push({n:document.getElementById('h_nome_'+k).value, c:document.getElementById('h_cpf_'+k).value}); }
  NH--; montarHospedes();
  vals.forEach(function(v,k){ document.getElementById('h_nome_'+k).value=v.n;
    document.getElementById('h_cpf_'+k).value=v.c; });
}

/* ================= CLAUSULAS E DECLARACOES ================= */
function montarClausulas(){
  document.getElementById('clausulas').innerHTML = T('clausulas').map(function(c){
    return '<div class="ac"><button onclick="this.parentNode.classList.toggle(\'on\')">'+
      '<span>'+c.t+'</span><i>+</i></button><div class="corpo">'+
      c.p.map(function(x){return '<p>'+x+'</p>';}).join('')+'</div></div>';
  }).join('');
}
function montarDecl(){
  var marcados=[].slice.call(document.querySelectorAll('#declBox input')).map(function(i){return i.checked;});
  document.getElementById('declBox').innerHTML = T('decl').map(function(d,i){
    return '<label><input type="checkbox" data-d="'+i+'"'+(marcados[i]?' checked':'')+'><span>'+d+'</span></label>';
  }).join('');
}

/* ================= ASSINATURA ================= */
var cv, ctx, desenhou=false, ultimo=null;
function initAssin(){
  cv=document.getElementById('cv');
  var r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(170*dpr);
  ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#2B2622';
  function pos(e){ var b=cv.getBoundingClientRect();
    var t=(e.touches&&e.touches[0])||e; return {x:t.clientX-b.left, y:t.clientY-b.top}; }
  function ini(e){ e.preventDefault(); ultimo=pos(e); desenhou=true; }
  function mov(e){ if(!ultimo) return; e.preventDefault(); var p=pos(e);
    ctx.beginPath(); ctx.moveTo(ultimo.x,ultimo.y); ctx.lineTo(p.x,p.y); ctx.stroke(); ultimo=p; }
  function fim(){ ultimo=null; }
  cv.addEventListener('pointerdown',ini); cv.addEventListener('pointermove',mov);
  window.addEventListener('pointerup',fim);
  cv.addEventListener('touchstart',ini,{passive:false});
  cv.addEventListener('touchmove',mov,{passive:false});
  cv.addEventListener('touchend',fim);
}
function limparAssin(){ if(ctx){ ctx.clearRect(0,0,cv.width,cv.height); desenhou=false; } }

/* ================= VALIDACAO ================= */
function marcarErro(idCampo, mal){
  var c=document.getElementById(idCampo); if(!c) return;
  c.classList.toggle('mal', !!mal);
  var i=c.querySelector('input'); if(i) i.classList.toggle('erro', !!mal);
}
function soDigitos(s){ return (s||'').replace(/\D/g,''); }

function validar(etapa){
  var primeiroErro=null;
  if(etapa===1){
    for(var i=0;i<NH;i++){
      var nome=document.getElementById('h_nome_'+i).value.trim();
      var doc =document.getElementById('h_cpf_'+i).value.trim();
      var malN = nome.split(/\s+/).length<2 || nome.length<5;
      var malC = doc.length<5 || (soDigitos(doc).length>0 && soDigitos(doc).length<5);
      marcarErro('c_h_nome_'+i, malN); marcarErro('c_h_cpf_'+i, malC);
      if(malN && !primeiroErro) primeiroErro='h_nome_'+i;
      if(malC && !primeiroErro) primeiroErro='h_cpf_'+i;
    }
  }
  if(etapa===2){
    var ci=document.getElementById('check_in').value, co=document.getElementById('check_out').value;
    var ho=document.getElementById('hora_chegada').value;
    var malI=!ci, malO=!co||(ci&&co<=ci), malH=!ho;
    marcarErro('c_in',malI); marcarErro('c_out',malO); marcarErro('c_hora',malH);
    if(malI&&!primeiroErro) primeiroErro='check_in';
    if(malO&&!primeiroErro) primeiroErro='check_out';
    if(malH&&!primeiroErro) primeiroErro='hora_chegada';
  }
  if(etapa===4){
    var todos=[].slice.call(document.querySelectorAll('#declBox input'));
    var falta=todos.some(function(i){return !i.checked;});
    document.getElementById('declBox').classList.toggle('mal', falta);
    if(falta){ if(!primeiroErro) primeiroErro='declBox'; aviso(T('errDecl')); }
    else if(!desenhou){ aviso(T('errAssin')); primeiroErro='cv'; }
  }
  if(primeiroErro){
    var el=document.getElementById(primeiroErro);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'});
      if(el.focus && el.tagName==='INPUT') setTimeout(function(){el.focus();},350); }
    return false;
  }
  return true;
}

/* ================= RESUMO ================= */
function coletar(){
  var hs=[];
  for(var i=0;i<NH;i++) hs.push({nome:document.getElementById('h_nome_'+i).value.trim(),
                                 cpf:document.getElementById('h_cpf_'+i).value.trim()});
  return {
    hospedes:hs,
    check_in:document.getElementById('check_in').value,
    check_out:document.getElementById('check_out').value,
    hora_chegada:document.getElementById('hora_chegada').value,
    placa:document.getElementById('placa').value.trim().toUpperCase()
  };
}
function montarResumo(){
  var d=coletar();
  var h='<div class="resumo"><h3>'+T('resumoH')+'</h3><dl>'+
    '<dt>'+T('rUnidade')+'</dt><dd>'+T('rUnidadeVal')+'</dd>'+
    '<dt>'+T('rTitular')+'</dt><dd>'+(d.hospedes[0]?d.hospedes[0].nome:'')+'</dd>';
  if(d.hospedes.length>1)
    h+='<dt>'+T('rHospedes')+'</dt><dd>'+d.hospedes.slice(1).map(function(x){return x.nome;}).join('<br>')+'</dd>';
  h+='<dt>'+T('rDatas')+'</dt><dd>'+fmt(d.check_in)+' → '+fmt(d.check_out)+'</dd>'+
     '<dt>'+T('rHora')+'</dt><dd>'+(d.hora_chegada||'—')+'</dd>';
  if(d.placa) h+='<dt>'+T('rPlaca')+'</dt><dd>'+d.placa+'</dd>';
  h+='</dl></div>';
  document.getElementById('resumoBox').innerHTML=h;
}
function fmt(s){ if(!s) return '—'; var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

/* ================= ENVIO ================= */
function enviar(){
  if(!validar(4)) return;
  if(enviando) return;
  enviando=true;
  var bt=document.getElementById('btSegue'); bt.disabled=true;
  var d=coletar();
  var assinatura='';
  try{ assinatura=cv.toDataURL('image/png'); }catch(e){}
  var payload={
    unidade:UNIDADE, tipo:'termo', idioma:L,
    check_in:d.check_in, check_out:d.check_out, hora_chegada:d.hora_chegada,
    titular:{nome:d.hospedes[0].nome, cpf:d.hospedes[0].cpf},
    hospedes:d.hospedes.slice(1),
    placa:d.placa, assinatura:assinatura,
    aceites:{contrato:true, nao_fumar:true, sem_festas:true, capacidade:true, checkout:true}
  };
  try{ var _b=JSON.stringify(payload); if(!(navigator.sendBeacon&&navigator.sendBeacon(EP_IN,new Blob([_b],{type:'text/plain;charset=UTF-8'})))){ fetch(EP_IN,{method:'POST',keepalive:true,headers:{'Content-Type':'text/plain;charset=UTF-8'},body:_b}).catch(function(){}); } }catch(e){}

  var msg=T('zapEnvio')+'\n\n'+
    d.hospedes.map(function(x,i){return (i===0?'👤 ':'• ')+x.nome+' — '+x.cpf;}).join('\n')+
    '\n\n📅 '+fmt(d.check_in)+' → '+fmt(d.check_out)+
    '\n🕒 '+(d.hora_chegada||'—')+
    (d.placa?'\n🚗 '+d.placa:'')+
    '\n\n✅ Regras aceitas e termo assinado.';

  mostrar(5);
  setTimeout(function(){ zap(msg); }, 600);
}

/* ================= NAVEGACAO ================= */
function mostrar(n){
  ETAPA=n;
  [1,2,3,4,5].forEach(function(i){
    document.getElementById('e'+i).classList.toggle('on', i===n); });
  var barras=document.querySelectorAll('.prog div');
  for(var i=0;i<4;i++) barras[i].classList.toggle('on', i < Math.min(n,4));
  document.querySelector('.prog').classList.toggle('hide', n===5);
  document.getElementById('passoRot').textContent = n<5 ? (n+'/4 · '+T('passos')[n-1]) : '';
  document.getElementById('btVolta').classList.toggle('hide', n===1||n===5);
  document.getElementById('navBar').classList.toggle('hide', n===5);
  var bt=document.getElementById('btSegue');
  bt.textContent = n===4 ? T('btEnviar') : T('btSegue');
  bt.className = n===4 ? 'enviar' : 'segue';
  bt.onclick = n===4 ? enviar : avancar;
  if(INICIADO){ var pn=document.querySelector('.painel');
    window.scrollTo({top: pn ? pn.offsetTop-14 : 0, behavior:'auto'}); }
  INICIADO = true;
  if(n===4){ montarDecl(); montarResumo(); if(!ctx) setTimeout(initAssin,60); }
}
function avancar(){ if(!validar(ETAPA)) return; mostrar(ETAPA+1); }
function voltar(){ if(ETAPA>1) mostrar(ETAPA-1); }

/* ================= IDIOMA ================= */
function aplicarIdioma(){
  document.documentElement.lang = L==='pt'?'pt-BR':L;
  [].forEach.call(document.querySelectorAll('[data-t]'),function(e){
    var v=T(e.dataset.t); if(typeof v==='string') e.innerHTML=v; });
  [].forEach.call(document.querySelectorAll('[data-ph]'),function(e){ e.placeholder=T(e.dataset.ph); });
  montarHospedes(); montarClausulas(); montarDecl();
  [].forEach.call(document.querySelectorAll('.lang button'),function(b){
    b.classList.toggle('on', b.dataset.l===L); });
  mostrar(ETAPA);
}
[].forEach.call(document.querySelectorAll('.lang button'),function(b){
  b.onclick=function(){ L=b.dataset.l; try{localStorage.setItem('alugo_lang',L);}catch(e){} aplicarIdioma(); };
});
(function init(){
  var s=null; try{ s=localStorage.getItem('alugo_lang'); }catch(e){}
  if(!s){ var n=(navigator.language||'pt').slice(0,2); s=(n==='en'||n==='es')?n:'pt'; }
  L=s;
  var hoje=new Date().toISOString().slice(0,10);
  document.getElementById('check_in').min=hoje;
  document.getElementById('check_out').min=hoje;
  document.getElementById('check_in').addEventListener('change',function(){
    document.getElementById('check_out').min=this.value; });
  aplicarIdioma();
})();
</script>

 function f(){b.classList.toggle('solto', window.scrollY > 70);}
 f(); window.addEventListener('scroll', f, {passive:true});})();
