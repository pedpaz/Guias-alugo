<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Check-in online · Blend 757 · aluGO</title>
<meta name="theme-color" content="#14171A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F7F6F3;--cartao:#FFF;--tinta:#1C1E20;--tinta-2:#63686D;--tinta-3:#979CA1;
  --azul:#1B9CD0;--azul-dk:#12749C;--azul-lo:#E8F5FB;
  --linha:#E5E3DE;--linha-2:#D8D5CE;--verde:#1FAA53;--verde-dk:#178C43;
  --alerta:#D97A2B;--alerta-lo:#FDF2E7;--vermelho:#C4453A;--vermelho-lo:#FBEDEC;
  --hero-bg:#14171A;
  --s1:0 1px 2px rgba(24,26,28,.06);--s2:0 2px 6px rgba(24,26,28,.07),0 8px 20px rgba(24,26,28,.05);
  --s3:0 4px 12px rgba(24,26,28,.10),0 22px 50px rgba(24,26,28,.13);
  --disp:'Fraunces',Georgia,serif;--corpo:'Manrope',system-ui,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--corpo);font-size:16px;
  line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:40px}
img{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit;font-size:inherit}
.ico{width:19px;height:19px;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;
  stroke-linejoin:round;fill:none;flex-shrink:0}
.wrap{max-width:600px;margin:0 auto;padding:0 20px}

#lang{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:flex-end;
  gap:2px;padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.lg{background:transparent;border:1px solid rgba(255,255,255,.34);color:#fff;font-size:.62rem;
  font-weight:800;letter-spacing:.12em;padding:6px 10px;border-radius:7px;cursor:pointer;text-transform:uppercase}
.lg.on{background:#fff;color:var(--hero-bg);border-color:#fff}

.hero{position:relative;height:42vh;min-height:280px;background:var(--hero-bg);overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;text-align:center}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 58%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,
  rgba(15,17,19,.66) 0%,rgba(15,17,19,.30) 40%,rgba(15,17,19,.92) 100%)}
.hero-in{position:relative;z-index:2;padding:0 24px 30px}
.hero-marca{height:42px;width:auto;margin:0 auto 18px}
.hero-olho{font-size:.56rem;font-weight:800;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(255,255,255,.7);margin-bottom:8px}
.hero-t{font-family:var(--disp);font-weight:400;font-size:2.1rem;color:#fff;line-height:1.05;letter-spacing:-.015em}
.hero-s{margin-top:8px;font-size:.82rem;color:rgba(255,255,255,.74)}

.stepper{display:flex;gap:6px;margin:22px 0 4px}
.st{flex:1;height:4px;border-radius:3px;background:var(--linha-2);transition:background .3s}
.st.on{background:var(--azul)}
.st.done{background:var(--verde)}
.st-lbl{font-size:.6rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--tinta-3);margin:12px 0 4px}

.et{display:none}
.et.on{display:block}
.et-t{font-family:var(--disp);font-weight:400;font-size:1.75rem;line-height:1.12;letter-spacing:-.015em;margin-bottom:6px}
.et-s{font-size:.9rem;color:var(--tinta-2);margin-bottom:22px}

.card{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:18px;
  box-shadow:var(--s1);margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card-t{font-size:.62rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--azul-dk)}
.rm{background:none;border:none;color:var(--vermelho);cursor:pointer;font-size:.72rem;font-weight:700}

.f{margin-bottom:13px}
.f:last-child{margin-bottom:0}
.f label{display:block;font-size:.6rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tinta-3);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;padding:13px 14px;border:1px solid var(--linha-2);
  border-radius:10px;background:var(--cartao);color:var(--tinta);outline:none;transition:border-color .2s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-lo)}
.f input.err,.f select.err{border-color:var(--vermelho);background:var(--vermelho-lo)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:.75rem;color:var(--tinta-3);margin-top:5px}

.bt{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px;
  border-radius:12px;border:none;font-size:.74rem;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;text-decoration:none;transition:transform .09s,border-bottom-width .09s}
.bt-azul{background:var(--azul);color:#fff;border-bottom:3px solid var(--azul-dk)}
.bt-azul:active{transform:translateY(3px);border-bottom-width:0}
.bt-verde{background:var(--verde);color:#fff;border-bottom:3px solid var(--verde-dk)}
.bt-verde:active{transform:translateY(3px);border-bottom-width:0}
.bt-linha{background:var(--cartao);color:var(--tinta-2);border:1px solid var(--linha-2)}
.bt-add{background:var(--azul-lo);color:var(--azul-dk);border:1px dashed var(--azul);margin-bottom:14px}
.navb{display:grid;grid-template-columns:auto 1fr;gap:10px;margin:22px 0 10px}
.navb.solo{grid-template-columns:1fr}

.cl{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:6px 18px;
  box-shadow:var(--s1);margin-bottom:16px;max-height:340px;overflow-y:auto}
.cl-i{padding:15px 0;border-bottom:1px solid var(--linha)}
.cl-i:last-child{border-bottom:none}
.cl-n{font-size:.6rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--azul-dk);margin-bottom:5px}
.cl-t{font-size:.89rem;color:var(--tinta-2);line-height:1.6}
.cl-t b{color:var(--tinta);font-weight:700}

.ac{display:flex;gap:12px;align-items:flex-start;background:var(--cartao);border:1px solid var(--linha);
  border-radius:12px;padding:14px 15px;margin-bottom:9px;cursor:pointer;user-select:none;transition:border-color .2s}
.ac.on{border-color:var(--verde);background:#F3FBF6}
.ac.err{border-color:var(--vermelho);background:var(--vermelho-lo)}
.ac-b{width:22px;height:22px;flex-shrink:0;border:1.7px solid var(--linha-2);border-radius:6px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;background:#fff;transition:.2s}
.ac.on .ac-b{background:var(--verde);border-color:var(--verde)}
.ac-v{display:none;color:#fff}
.ac.on .ac-v{display:flex}
.ac-v svg{width:13px;height:13px;stroke-width:3.2}
.ac-t{font-size:.88rem;line-height:1.5;color:var(--tinta-2)}
.ac-t b{color:var(--tinta);font-weight:700}

.dest{border-radius:12px;padding:15px 17px;margin-bottom:16px;border-left:3px solid}
.dest-t{font-weight:800;font-size:.88rem;margin-bottom:4px}
.dest-p{font-size:.85rem;line-height:1.58}
.dest.aviso{background:var(--alerta-lo);border-color:var(--alerta)}
.dest.aviso .dest-t{color:#A85B18}.dest.aviso .dest-p{color:#7C4A19}
.dest.proibido{background:var(--vermelho-lo);border-color:var(--vermelho)}
.dest.proibido .dest-t{color:#9E332A}.dest.proibido .dest-p{color:#7A2F28}

#sig{width:100%;height:170px;border:1px dashed var(--linha-2);border-radius:12px;background:#fff;
  touch-action:none;display:block}
.sig-b{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.sig-h{font-size:.75rem;color:var(--tinta-3)}

.res{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;overflow:hidden;
  box-shadow:var(--s1);margin-bottom:16px}
.res-r{display:flex;justify-content:space-between;gap:14px;padding:12px 16px;border-bottom:1px solid var(--linha);font-size:.88rem}
.res-r:last-child{border-bottom:none}
.res-k{color:var(--tinta-3);font-size:.6rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;flex-shrink:0}
.res-v{text-align:right;font-weight:600}

.erro{background:var(--vermelho-lo);color:#9E332A;border-left:3px solid var(--vermelho);
  border-radius:10px;padding:12px 15px;font-size:.86rem;font-weight:600;margin-bottom:14px;display:none}
.erro.on{display:block}

#fim{display:none;text-align:center;padding:50px 0 20px}
#fim.on{display:block}
.fim-c{width:78px;height:78px;border-radius:50%;background:var(--verde);display:flex;align-items:center;
  justify-content:center;margin:0 auto 22px}
.fim-c .ico{width:38px;height:38px;color:#fff;stroke-width:2.6}
.fim-t{font-family:var(--disp);font-weight:400;font-size:2rem;line-height:1.1;margin-bottom:10px}
.fim-p{color:var(--tinta-2);margin-bottom:26px}
.rod{text-align:center;padding:32px 20px 10px;font-size:.74rem;color:var(--tinta-3);line-height:1.7}
.rod img{height:26px;width:auto;margin:0 auto 12px;opacity:.85}
@media(max-width:380px){.f2{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="hero">
  <div id="lang">
    <button class="lg" data-l="pt">PT</button>
    <button class="lg" data-l="en">EN</button>
    <button class="lg" data-l="es">ES</button>
  </div>
  <img class="bg" id="heroImg" alt="">
  <div class="hero-in">
    <img class="hero-marca" id="heroMarca" alt="Blend Smart Style">
    <div class="hero-olho" id="heroOlho"></div>
    <h1 class="hero-t" id="heroT"></h1>
    <div class="hero-s">Blend Smart Style · 757 · Setor Marista</div>
  </div>
</header>

<main class="wrap" id="app">
  <div class="stepper"><div class="st"></div><div class="st"></div><div class="st"></div><div class="st"></div></div>
  <div class="st-lbl" id="stLbl"></div>

  <div class="erro" id="erro"></div>

  <!-- 1 · HÓSPEDES -->
  <section class="et" data-e="0">
    <h2 class="et-t" id="e1t"></h2>
    <p class="et-s" id="e1s"></p>
    <div id="hosps"></div>
    <button class="bt bt-add" type="button" onclick="addHosp()">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      <span id="btAdd"></span>
    </button>
    <div class="dest aviso"><div class="dest-t" id="capT"></div><div class="dest-p" id="capP"></div></div>
    <div class="navb solo"><button class="bt bt-azul" type="button" onclick="ir(1)" id="b1"></button></div>
  </section>

  <!-- 2 · RESERVA -->
  <section class="et" data-e="1">
    <h2 class="et-t" id="e2t"></h2>
    <p class="et-s" id="e2s"></p>
    <div class="card">
      <div class="f2">
        <div class="f"><label id="lIn"></label><input type="date" id="checkIn"></div>
        <div class="f"><label id="lOut"></label><input type="date" id="checkOut"></div>
      </div>
      <div class="f"><label id="lHora"></label>
        <select id="horaChegada"><option value=""></option></select>
        <div class="hint" id="hHora"></div>
      </div>
      <div class="f"><label id="lPlaca"></label><input type="text" id="placa" maxlength="10" autocapitalize="characters">
        <div class="hint" id="hPlaca"></div></div>
    </div>
    <div class="navb">
      <button class="bt bt-linha" type="button" onclick="ir(0)" id="v2"></button>
      <button class="bt bt-azul" type="button" onclick="ir(2)" id="b2"></button>
    </div>
  </section>

  <!-- 3 · REGRAS -->
  <section class="et" data-e="2">
    <h2 class="et-t" id="e3t"></h2>
    <p class="et-s" id="e3s"></p>
    <div class="dest proibido"><div class="dest-t" id="fumT"></div><div class="dest-p" id="fumP"></div></div>
    <div class="cl" id="clausulas"></div>
    <div id="aceites"></div>
    <div class="navb">
      <button class="bt bt-linha" type="button" onclick="ir(1)" id="v3"></button>
      <button class="bt bt-azul" type="button" onclick="ir(3)" id="b3"></button>
    </div>
  </section>

  <!-- 4 · ASSINATURA -->
  <section class="et" data-e="3">
    <h2 class="et-t" id="e4t"></h2>
    <p class="et-s" id="e4s"></p>
    <div class="res" id="resumo"></div>
    <canvas id="sig"></canvas>
    <div class="sig-b"><span class="sig-h" id="sigH"></span>
      <button class="rm" type="button" onclick="limparSig()" id="sigL"></button></div>
    <div class="navb">
      <button class="bt bt-linha" type="button" onclick="ir(2)" id="v4"></button>
      <button class="bt bt-verde" type="button" onclick="enviar()" id="b4"></button>
    </div>
  </section>

  <section id="fim">
    <div class="fim-c"><svg class="ico" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></svg></div>
    <h2 class="fim-t" id="fimT"></h2>
    <p class="fim-p" id="fimP"></p>
    <a class="bt bt-azul" id="fimG" href="https://pedpaz.github.io/Guias-alugo/guia-blend-757.html"></a>
  </section>

  <div class="rod">
    <img id="rodMarca" alt="aluGO">
    <div id="rod1"></div>
  </div>
</main>

/* ═══ estado ═══ */
var L='pt';
(function(){ var s=null; try{s=localStorage.getItem('blend757_lang');}catch(e){}
  if(s&&T[s]){L=s;return;} var n=(navigator.language||'pt').slice(0,2).toLowerCase(); L=T[n]?n:'pt'; })();
var etapa=0, hosps=[{nome:'',cpf:''}], aceites={};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function render(){
  var t=T[L];
  document.documentElement.lang=t.lang;
  try{localStorage.setItem('blend757_lang',L);}catch(e){}
  document.querySelectorAll('.lg').forEach(function(b){b.classList.toggle('on',b.dataset.l===L);});
  $('heroImg').src=FOTO_HERO; $('heroMarca').src=MARCA_BLEND; $('rodMarca').src=MARCA_ALUGO;
  $('heroOlho').textContent=t.heroOlho; $('heroT').textContent=t.heroT;
  $('stLbl').textContent=t.passos[etapa];
  $('e1t').textContent=t.e1t; $('e1s').textContent=t.e1s;
  $('btAdd').textContent=t.btAdd; $('capT').textContent=t.capT; $('capP').textContent=t.capP;
  $('b1').textContent=t.b1;
  $('e2t').textContent=t.e2t; $('e2s').textContent=t.e2s;
  $('lIn').textContent=t.lIn; $('lOut').textContent=t.lOut; $('lHora').textContent=t.lHora;
  $('hHora').textContent=t.hHora; $('lPlaca').textContent=t.lPlaca; $('hPlaca').textContent=t.hPlaca;
  $('b2').textContent=t.b2; $('v2').textContent=t.v;
  $('e3t').textContent=t.e3t; $('e3s').textContent=t.e3s;
  $('fumT').textContent=t.fumT; $('fumP').textContent=t.fumP;
  $('b3').textContent=t.b3; $('v3').textContent=t.v;
  $('e4t').textContent=t.e4t; $('e4s').textContent=t.e4s;
  $('sigH').textContent=t.sigH; $('sigL').textContent=t.sigL;
  $('b4').textContent=t.b4; $('v4').textContent=t.v;
  $('fimT').textContent=t.fimT; $('fimP').textContent=t.fimP; $('fimG').textContent=t.fimG;
  $('fimG').href=CFG.guia; $('rod1').textContent=t.rod1;

  var h=$('horaChegada'), atual=h.value;
  h.innerHTML='<option value="">—</option>';
  for(var i=15;i<=23;i++){ h.innerHTML+='<option value="'+i+':00">'+i+':00</option>'; }
  h.innerHTML+='<option value="00:00">00:00</option><option value="depois">'+(L==='pt'?'depois da meia-noite':L==='en'?'after midnight':'después de medianoche')+'</option>';
  h.value=atual;

  desenhaHosps(); desenhaClausulas(); desenhaAceites(); mostraEtapa();
}

function desenhaHosps(){
  var t=T[L], box=$('hosps'); box.innerHTML='';
  hosps.forEach(function(hp,i){
    var d=document.createElement('div'); d.className='card';
    d.innerHTML='<div class="card-h"><span class="card-t">'+(i===0?t.titular:t.hospede+' '+(i+1))+'</span>'+
      (i>0?'<button class="rm" type="button" data-rm="'+i+'">'+t.remover+'</button>':'')+'</div>'+
      '<div class="f"><label>'+t.nome+'</label><input type="text" data-f="nome" data-i="'+i+'" value="'+esc(hp.nome)+'" autocomplete="name"></div>'+
      '<div class="f"><label>'+t.cpf+'</label><input type="text" data-f="cpf" data-i="'+i+'" value="'+esc(hp.cpf)+'" inputmode="text"></div>';
    box.appendChild(d);
  });
  box.querySelectorAll('input').forEach(function(inp){
    inp.addEventListener('input',function(){ hosps[+inp.dataset.i][inp.dataset.f]=inp.value; inp.classList.remove('err'); });
  });
  box.querySelectorAll('[data-rm]').forEach(function(b){
    b.onclick=function(){ hosps.splice(+b.dataset.rm,1); desenhaHosps(); };
  });
  $('btAdd').parentNode.style.display = hosps.length>=CFG.capacidade ? 'none' : '';
}
function addHosp(){ if(hosps.length<CFG.capacidade){ hosps.push({nome:'',cpf:''}); desenhaHosps(); } }

function desenhaClausulas(){
  $('clausulas').innerHTML=T[L].clausulas.map(function(c){
    return '<div class="cl-i"><div class="cl-n">'+c[0]+'</div><div class="cl-t">'+c[1]+'</div></div>'; }).join('');
}
function desenhaAceites(){
  var box=$('aceites'); box.innerHTML='';
  T[L].aceites.forEach(function(a){
    var d=document.createElement('div');
    d.className='ac'+(aceites[a[0]]?' on':'');
    d.innerHTML='<div class="ac-b"><span class="ac-v"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg></span></div><div class="ac-t">'+a[1]+'</div>';
    d.onclick=function(){ aceites[a[0]]=!aceites[a[0]]; d.classList.toggle('on',aceites[a[0]]); d.classList.remove('err'); };
    box.appendChild(d);
  });
}

function mostraEtapa(){
  document.querySelectorAll('.et').forEach(function(s){ s.classList.toggle('on', +s.dataset.e===etapa); });
  document.querySelectorAll('.st').forEach(function(s,i){
    s.classList.toggle('on', i===etapa); s.classList.toggle('done', i<etapa); });
  $('stLbl').textContent=T[L].passos[etapa];
}
function erro(msg){ var e=$('erro'); if(!msg){ e.classList.remove('on'); return false; }
  e.textContent=msg; e.classList.add('on'); e.scrollIntoView({behavior:'smooth',block:'center'}); return true; }

function valida(de){
  var t=T[L]; erro(null);
  if(de===0){
    for(var i=0;i<hosps.length;i++){
      if(!hosps[i].nome.trim()){ marcaErro(i,'nome'); return erro(t.erros.nome)?false:false; }
      if(!hosps[i].cpf.trim()){ marcaErro(i,'cpf'); return erro(t.erros.cpf)?false:false; }
    }
  }
  if(de===1){
    var a=$('checkIn').value, b=$('checkOut').value;
    if(!a||!b){ $('checkIn').classList.toggle('err',!a); $('checkOut').classList.toggle('err',!b);
      erro(t.erros.datas); return false; }
    if(b<=a){ $('checkOut').classList.add('err'); erro(t.erros.ordem); return false; }
  }
  if(de===2){
    var falta=false;
    T[L].aceites.forEach(function(x,i){ if(!aceites[x[0]]){ falta=true;
      document.querySelectorAll('#aceites .ac')[i].classList.add('err'); } });
    if(falta){ erro(t.erros.aceites); return false; }
  }
  return true;
}
function marcaErro(i,f){
  var el=document.querySelector('#hosps input[data-i="'+i+'"][data-f="'+f+'"]');
  if(el){ el.classList.add('err'); el.focus(); }
}

function ir(n){
  if(n>etapa){ for(var d=etapa;d<n;d++){ if(!valida(d)){ etapa=d; mostraEtapa(); return; } } }
  etapa=n; mostraEtapa();
  if(n===3){ resumo(); if(!temSig) initSig(); }   // o canvas só tem tamanho depois de visível
  window.scrollTo({top:0,behavior:'smooth'});
}

function resumo(){
  var t=T[L], r=t.resumo;
  var linhas=[
    [r.un, CFG.nome],
    [r.hosp, hosps.map(function(h){return esc(h.nome);}).join('<br>')],
    [r.datas, (fmt($('checkIn').value)+' → '+fmt($('checkOut').value))],
    [r.hora, $('horaChegada').value||'—']
  ];
  if($('placa').value.trim()) linhas.push([r.placa, esc($('placa').value.toUpperCase())]);
  $('resumo').innerHTML=linhas.map(function(l){
    return '<div class="res-r"><span class="res-k">'+l[0]+'</span><span class="res-v">'+l[1]+'</span></div>'; }).join('');
}
function fmt(d){ if(!d) return '—'; var p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

/* ═══ assinatura ═══ */
var cv,ctx,pintando=false,temSig=false;
function initSig(){
  cv=$('sig'); var r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1C1E20';
  function pos(e){ var b=cv.getBoundingClientRect();
    var p=e.touches?e.touches[0]:e; return {x:p.clientX-b.left,y:p.clientY-b.top}; }
  function ini(e){ e.preventDefault(); pintando=true; temSig=true; var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function mov(e){ if(!pintando) return; e.preventDefault(); var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
  function fim(){ pintando=false; }
  cv.addEventListener('mousedown',ini); cv.addEventListener('mousemove',mov);
  window.addEventListener('mouseup',fim);
  cv.addEventListener('touchstart',ini,{passive:false});
  cv.addEventListener('touchmove',mov,{passive:false});
  cv.addEventListener('touchend',fim);
}
function limparSig(){ if(ctx) ctx.clearRect(0,0,cv.width,cv.height); temSig=false; }

/* ═══ envio ═══ */
function enviar(){
  var t=T[L];
  for(var d=0;d<3;d++){ if(!valida(d)){ etapa=d; mostraEtapa(); return; } }
  if(!temSig){ erro(t.erros.assinatura); return; }
  erro(null);
  var payload={
    unidade:CFG.unidade, tipo:'termo',
    check_in:$('checkIn').value, check_out:$('checkOut').value,
    hora_chegada:$('horaChegada').value,
    titular:{ nome:hosps[0].nome.trim(), cpf:hosps[0].cpf.trim() },
    hospedes:hosps.slice(1).map(function(h){ return { nome:h.nome.trim(), cpf:h.cpf.trim() }; }),
    placa:$('placa').value.trim().toUpperCase(),
    assinatura:cv.toDataURL('image/png'),
    aceites:{ contrato:!!aceites.contrato, nao_fumar:!!aceites.nao_fumar,
              sem_festas:!!aceites.sem_festas, capacidade:!!aceites.capacidade,
              checkout:!!aceites.checkout }
  };
  try{ var _b=JSON.stringify(payload); if(!(navigator.sendBeacon&&navigator.sendBeacon(CFG.api,new Blob([_b],{type:'text/plain;charset=UTF-8'})))){ fetch(CFG.api,{ method:'POST', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:_b }).catch(function(){}); } }catch(e){}
  document.querySelectorAll('.et').forEach(function(s){ s.classList.remove('on'); });
  document.querySelector('.stepper').style.display='none';
  $('stLbl').style.display='none';
  $('fim').classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(function(){ avisarWpp(payload); }, 600);
}
function avisarWpp(p){
  var m='📝 *CHECK-IN ONLINE*\n━━━━━━━━━━━━━━━━━━━━\n\n'+
    '🏢 '+CFG.nome+'\n🔖 Código: '+CFG.unidade+'\n\n'+
    '👤 Titular: '+p.titular.nome+' ('+p.titular.cpf+')\n';
  if(p.hospedes.length) m+='👥 Hóspedes:\n'+p.hospedes.map(function(h){return '   • '+h.nome+' ('+h.cpf+')';}).join('\n')+'\n';
  m+='\n📅 '+fmt(p.check_in)+' → '+fmt(p.check_out)+'\n';
  if(p.hora_chegada) m+='🕒 Chegada prevista: '+p.hora_chegada+'\n';
  if(p.placa) m+='🚗 Placa: '+p.placa+'\n';
  m+='\n✅ Todos os aceites confirmados e termo assinado.';
  var wa='https://wa.me/'+CFG.wpp+'?text='+encodeURIComponent(m);
  var app=wa.replace('https://wa.me/','whatsapp://send?phone=').replace('?text=','&text=');
  var tm=setTimeout(function(){ if(!document.hidden) window.location.href=wa; },1500);
  document.addEventListener('visibilitychange',function h(){
    if(document.hidden){ clearTimeout(tm); document.removeEventListener('visibilitychange',h); } });
  window.location.href=app;
}

document.querySelectorAll('.lg').forEach(function(b){ b.onclick=function(){ L=b.dataset.l; render(); }; });
$('placa').addEventListener('input',function(){ this.value=this.value.toUpperCase(); });
render();
window.addEventListener('resize', function(){ if(etapa===3 && !temSig) initSig(); });
window.ir=ir; window.addHosp=addHosp; window.enviar=enviar; window.limparSig=limparSig;
console.log('[TERMO BLE-757] ok');
</script>
