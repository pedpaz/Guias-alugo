<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>aluGO · Check-in online</title>
<meta name="theme-color" content="#101613">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#FAF8F3; --creme:#FFFEFB; --campo:#F5F2EA;
  --tinta:#1B1F1C; --tinta-2:#5E645F; --tinta-3:#9AA09B;
  --verde:#1B9E4B; --verde-esc:#147A3A; --verde-bg:#E8F6EC; --verde-cl:#8FD3A6;
  --laranja:#F28C28; --laranja-esc:#C96A12; --laranja-bg:#FDEFE0;
  --linha:#E6E3DA; --alerta:#B3261E;
  --hero:#101613;
  --r:20px;
  --s1:0 1px 2px rgba(27,31,28,.05);
  --s3:0 4px 12px rgba(27,31,28,.06), 0 22px 50px rgba(27,31,28,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:Manrope,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.6;padding-bottom:120px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.12;margin:0;letter-spacing:-.015em}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:660px;margin:0 auto;padding:0 20px}

.lang{position:fixed;top:0;left:0;right:0;z-index:80;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.lang.solto{background:rgba(250,248,243,.94);backdrop-filter:blur(14px);border-bottom-color:var(--linha)}
.lang .wrap{display:flex;justify-content:flex-end;gap:5px;padding:calc(10px + env(safe-area-inset-top)) 20px 10px}
.lang button{padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.1em;
  color:rgba(255,255,255,.72);border:1px solid transparent;transition:.2s}
.lang button.on{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.34)}
.lang.solto button{color:var(--tinta-3)}
.lang.solto button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}

/* capa */
.hero{position:relative;min-height:50vh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--hero)}
.hero .bg{position:absolute;inset:0;
  background:
    radial-gradient(60% 55% at 20% 15%,rgba(27,158,75,.35),transparent 70%),
    radial-gradient(45% 45% at 85% 20%,rgba(242,140,40,.22),transparent 70%),
    var(--hero)}
.hero .grade{position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:36px 36px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 85%);-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 85%)}
.hero .veu{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(16,22,19,.6) 80%,var(--papel) 100%)}
.hero .in{position:relative;padding:calc(70px + env(safe-area-inset-top)) 24px 84px;max-width:660px;margin:0 auto;width:100%;text-align:center}
.hero .marca{width:150px;margin:0 auto 26px;opacity:.96;filter:drop-shadow(0 4px 18px rgba(0,0,0,.45))}
.hero .rot{font-size:10.5px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.62);margin-bottom:10px}
.hero h1{font-size:clamp(30px,8.5vw,44px);font-weight:600;color:#fff;line-height:1.05;text-shadow:0 3px 30px rgba(0,0,0,.42)}
.hero .sub{color:rgba(255,255,255,.78);font-size:14px;margin-top:10px;letter-spacing:.02em}
.hero .chip{display:inline-block;margin-top:16px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);color:#fff;font-size:13px;font-weight:700;backdrop-filter:blur(6px)}

.painel{position:relative;z-index:5;margin:-44px 0 0;background:var(--creme);border:1px solid var(--linha);
  border-radius:var(--r);box-shadow:var(--s3);padding:20px 18px 22px}
@media(max-width:430px){.painel{padding:18px 15px 20px}}

.prog{display:flex;gap:6px;margin:4px 0 6px}
.prog div{flex:1;height:5px;border-radius:999px;background:var(--linha);transition:background .25s}
.prog div.on{background:var(--verde)}
.passo{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--laranja-esc);margin-bottom:16px}

.etapa{display:none}
.etapa.on{display:block;animation:sobe .24s ease}
@keyframes sobe{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.etapa h2{font-size:clamp(23px,6vw,30px);margin-bottom:6px}
.etapa .lead{color:var(--tinta-2);font-size:14.5px;margin:0 0 20px}

.campo{margin-bottom:14px}
.campo label{display:block;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:6px}
.campo input,.campo select{width:100%;padding:14px 15px;border:1px solid var(--linha);border-radius:13px;
  background:var(--campo);font-family:inherit;font-size:16px;outline:none;color:var(--tinta)}
.campo input:focus,.campo select:focus{border-color:var(--verde);background:#fff}
.campo input.erro{border-color:var(--alerta);background:#FEF3F0}
.campo .msg{font-size:12.5px;color:var(--alerta);margin-top:5px;display:none}
.campo.mal .msg{display:block}
.campo .dica{font-size:12.5px;color:var(--tinta-3);margin-top:5px}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:430px){.dois{grid-template-columns:1fr}}

.hosp{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--s1);position:relative}
.hosp .cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hosp .cab b{font-family:Fraunces;font-size:16px;font-weight:600}
.hosp .rm{font-size:12px;font-weight:700;color:var(--alerta)}
.doctipo{display:inline-flex;gap:4px;padding:3px;border-radius:999px;background:var(--campo);border:1px solid var(--linha);margin-bottom:8px}
.doctipo button{padding:5px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--tinta-2)}
.doctipo button.on{background:var(--tinta);color:#fff}
.hosp .crianca{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--tinta-2);margin:-4px 0 4px;cursor:pointer}
.hosp .crianca input{width:19px;height:19px;accent-color:var(--verde);margin:0}
.addh{width:100%;padding:14px;border:1.5px dashed var(--verde-cl);border-radius:14px;color:var(--verde-esc);
  font-weight:800;font-size:14.5px;background:var(--verde-bg)}
.lim{font-size:12.5px;color:var(--tinta-2);margin-top:9px;text-align:center}

/* horários de chegada em botões */
.horas{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.horas button{padding:11px 4px;border:1px solid var(--linha);border-radius:11px;background:var(--campo);font-size:14.5px;font-weight:700;color:var(--tinta);font-variant-numeric:tabular-nums}
.horas button.on{background:var(--verde);border-color:var(--verde);color:#fff}
.horas button.noite{grid-column:span 2;font-size:13px}
.campo.mal .horas button{border-color:var(--alerta)}

/* regras: todas abertas, leitura corrida */
.regra{border:1px solid var(--linha);border-radius:14px;background:var(--papel);margin-bottom:9px;padding:13px 15px}
.regra h3{font-family:Manrope;font-size:14.5px;font-weight:800;margin:0 0 6px;color:var(--tinta)}
.regra p{margin:0 0 7px;color:var(--tinta-2);font-size:14px;line-height:1.55}
.regra p:last-child{margin:0}
.regra.destaque{border-color:#F0B8B4;background:#FFF5F4}
.regra.destaque h3{color:var(--alerta)}
.fumar{display:flex;gap:12px;align-items:flex-start;background:var(--alerta);color:#fff;border-radius:14px;padding:14px 15px;margin-bottom:12px;font-size:14px;line-height:1.45}
.fumar .ico{font-size:26px;line-height:1;flex:none}
.fumar b{display:block;font-size:15px;margin-bottom:2px}
.aceita{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:15px 16px;border-radius:16px;background:var(--verde-bg);border:1.5px solid var(--verde-cl);font-size:15px;font-weight:700;cursor:pointer}
.aceita input{width:22px;height:22px;accent-color:var(--verde);flex:none;margin-top:1px}
.aceita.mal{border-color:var(--alerta);background:#FEF3F0}

.decl{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:6px 16px;margin-bottom:14px;box-shadow:var(--s1)}
.decl label{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--linha);font-size:14.5px;cursor:pointer}
.decl label:last-child{border-bottom:0}
.decl input{width:21px;height:21px;accent-color:var(--verde);flex:none;margin-top:1px}
.decl.mal{border-color:var(--alerta)}

.assin{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:16px;box-shadow:var(--s1);margin-bottom:14px}
.assin canvas{width:100%;height:170px;border:1px dashed var(--verde-cl);border-radius:12px;background:#fff;touch-action:none;display:block}
.assin .barra{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--tinta-2)}
.assin .limpar{font-weight:800;color:var(--verde-esc)}

.resumo{background:var(--verde-bg);border:1px solid var(--verde-cl);border-radius:16px;padding:16px;margin-bottom:16px}
.resumo h3{font-size:16px;margin-bottom:9px}
.resumo dl{margin:0;font-size:14px}
.resumo dt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);margin-top:9px}
.resumo dd{margin:2px 0 0}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,254,251,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--linha);padding:11px 12px calc(11px + env(safe-area-inset-bottom))}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.nav button{flex:1;padding:16px;border-radius:14px;font-weight:800;letter-spacing:.03em}
.nav .volta{border:1.5px solid var(--linha);color:var(--tinta-2);flex:0 0 34%}
.nav .segue{background:var(--verde);color:#fff}
.nav .enviar{background:var(--laranja);color:#fff}
.nav button[disabled]{opacity:.55}

.ok{text-align:center;padding:40px 0}
.ok .tick{width:78px;height:78px;border-radius:50%;background:var(--verde);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.ok h2{font-size:28px;margin-bottom:10px}
.ok p{color:var(--tinta-2);margin:0 0 22px}
.ok a{display:block;padding:16px;border-radius:14px;background:var(--verde);color:#fff;text-decoration:none;font-weight:800;margin-bottom:11px}
.ok a.linha{background:none;border:1.5px solid var(--tinta);color:var(--tinta)}
.rodape{text-align:center;padding:30px 20px 6px;margin:30px 0 0;color:var(--tinta-3);font-size:11.5px;letter-spacing:.06em}
.rodape::before{content:'';display:block;width:46px;height:1px;background:var(--linha);margin:0 auto 24px}
.rodape img{width:104px;height:auto;opacity:.92;display:block;margin:0 auto 10px}
.hide{display:none!important}

.semlink{max-width:520px;margin:60px auto;padding:0 24px;text-align:center}
.semlink img{width:140px;margin:0 auto 24px}
.semlink h2{font-size:26px;margin-bottom:10px}
.semlink p{color:var(--tinta-2)}
.semlink a{display:inline-block;margin-top:14px;padding:14px 22px;border-radius:14px;background:var(--verde);color:#fff;text-decoration:none;font-weight:800}

#aviso{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:999;background:var(--alerta);color:#fff;
  border-radius:14px;padding:13px 16px;font-size:14.5px;font-weight:600;line-height:1.35;box-shadow:0 10px 28px rgba(0,0,0,.28);
  opacity:0;transform:translateY(-14px);pointer-events:none;transition:opacity .2s,transform .2s}
#aviso.on{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<div id="aviso" role="alert" aria-live="assertive"></div>

<div id="semlink" class="semlink hide">
  <img src="assets/alugo.png" alt="aluGO">
  <h2>Link incompleto</h2>
  <p>Este link de check-in não diz qual apartamento é o seu. Abra o link que recebeu na mensagem da reserva ou fale com a aluGO.</p>
  <a href="#" onclick="zap('Olá! Meu link de check-in não abriu.');return false">Falar com a aluGO</a>
</div>

<div id="tudo">
<div class="lang" id="barraLang"><div class="wrap">
  <button data-l="pt" class="on">PT</button>
  <button data-l="en">EN</button>
  <button data-l="es">ES</button>
</div></div>

<header class="hero">
  <div class="bg"></div>
  <div class="grade"></div>
  <div class="veu"></div>
  <div class="in">
    <img class="marca" src="assets/alugo-branco.png" alt="aluGO">
    <div class="rot" data-t="heroRot"></div>
    <h1 data-t="tituloPag"></h1>
    <p class="sub" id="subPag"></p>
    <span class="chip" id="chipUn"></span>
  </div>
</header>

<main class="wrap" id="app">
  <div class="painel">
  <div class="prog"><div class="on"></div><div></div><div></div><div></div></div>
  <div class="passo" id="passoRot"></div>

  <section class="etapa on" id="e1">
    <h2 data-t="e1h"></h2>
    <p class="lead" data-t="e1lead"></p>
    <div id="hospedes"></div>
    <button class="addh" onclick="addHosp()" data-t="addHosp"></button>
    <div class="lim" id="limite"></div>
  </section>

  <section class="etapa" id="e2">
    <h2 data-t="e2h"></h2>
    <p class="lead" id="e2lead"></p>
    <div class="dois">
      <div class="campo" id="c_in">
        <label data-t="lIn"></label><input type="date" id="check_in">
        <div class="msg" data-t="errObrig"></div>
      </div>
      <div class="campo" id="c_out">
        <label data-t="lOut"></label><input type="date" id="check_out">
        <div class="msg" data-t="errData"></div>
      </div>
    </div>
    <div class="campo" id="c_hora">
      <label data-t="lHora"></label>
      <input type="hidden" id="hora_chegada">
      <div class="dica" id="dicaHora" style="margin:0 0 8px"></div>
      <div class="horas" id="horas"></div>
      <div class="msg" data-t="errHora"></div>
    </div>
    <div class="campo hide" id="c_placa">
      <label data-t="lPlaca"></label>
      <input type="text" id="placa" maxlength="8" data-ph="phPlaca" style="text-transform:uppercase">
    </div>
  </section>

  <section class="etapa" id="e3">
    <h2 data-t="e3h"></h2>
    <p class="lead" id="e3lead"></p>
    <div class="fumar"><span class="ico">🚭</span><div><b data-t="fumarTit"></b><span id="fumarTxt"></span></div></div>
    <div id="clausulas"></div>
    <label class="aceita" id="aceitaBox"><input type="checkbox" id="aceitaRegras"><span data-t="aceitaRegras"></span></label>
  </section>

  <section class="etapa" id="e4">
    <h2 data-t="e4h"></h2>
    <p class="lead" data-t="e4lead"></p>
    <div class="decl" id="declBox"></div>
    <div class="assin">
      <label style="display:block;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:8px" data-t="lAssin"></label>
      <canvas id="cv"></canvas>
      <div class="barra"><span data-t="assinDica"></span><button class="limpar" onclick="limparAssin()" data-t="assinLimpar"></button></div>
    </div>
    <div id="resumoBox"></div>
  </section>

  <section class="etapa" id="e5">
    <div class="ok">
      <div class="tick">✓</div>
      <h2 data-t="okH"></h2>
      <p id="okP"></p>
      <a href="#" id="okGuia" data-t="okGuia"></a>
      <a class="linha" href="#" onclick="zap(T('zapOi'));return false" data-t="okZap"></a>
    </div>
  </section>

  </div>
  <div class="rodape"><img src="assets/alugo.png" alt="aluGO"><span data-t="rodape"></span></div>
</main>

<nav class="nav" id="navBar"><div class="in">
  <button class="volta hide" id="btVolta" onclick="voltar()" data-t="btVolta"></button>
  <button class="segue" id="btSegue" onclick="avancar()" data-t="btSegue"></button>
</div></nav>
</div>

<script src="termo-config.js"></script>
<script>
/* ================= AVISO ================= */
var _avisoT=null;
function aviso(msg){
  var el=document.getElementById('aviso'); if(!el) return;
  el.textContent=msg; el.classList.add('on');
  clearTimeout(_avisoT); _avisoT=setTimeout(function(){ el.classList.remove('on'); },4200);
  try{ if(navigator.vibrate) navigator.vibrate(30); }catch(e){}
}

/* ================= UNIDADE (vem do link: termo.html?u=QS-1701) ================= */
var EP_IN = "https://loftcare-os.vercel.app/api/public/checkin";
var WHATS = "5562982545453";
var BASE  = "https://pedpaz.github.io/Guias-alugo/";
var U = null;
(function(){
  var m=/[?&]u=([^&#]+)/.exec(location.search||'');
  var code=m?decodeURIComponent(m[1]).toUpperCase():'';
  U = (window.UNIDADES && window.UNIDADES[code]) || null;
  if(!U){
    document.getElementById('tudo').classList.add('hide');
    document.getElementById('semlink').classList.remove('hide');
  } else {
    U.code=code;
    document.title = 'Check-in online · '+U.predio+' '+U.unidade+' · aluGO';
  }
})();

  resumoH:"Confira antes de enviar", rTitular:"Titular", rHospedes:"Hóspedes", rDatas:"Período", rHora:"Chegada prevista", rPlaca:"Veículo", rTel:"Celular", rUnidade:"Unidade",
  btVolta:"Voltar", btSegue:"Continuar", btEnviar:"Enviar check-in",

var L='pt', ETAPA=1, NH=1, enviando=false, INICIADO=false;

/* Texto: pega o idioma, cai pro PT, e troca os {campos} pelos dados do apê. */
function tx(v){ if(v==null) return ''; if(typeof v==='object' && !Array.isArray(v)) return v[L]!=null?v[L]:(v.pt||''); return v; }
function fill(s){
  if(typeof s!=='string') return s;
  return s.replace(/\{(\w+)\}/g,function(_,k){
    if(k==='n') return String(clausulasAtuais().length);
    var v=U&&U[k]; if(v==null) v=(window.PADRAO||{})[k];
    return v==null?'':tx(v);
  });
}
function T(k){ var v=(TXT[L]&&TXT[L][k]!=null)?TXT[L][k]:TXT.pt[k]; return Array.isArray(v)?v.map(fill):fill(v); }

/* Cláusulas: as padrão (window.CLAUSULAS, com {campos}), menos as que o apê tira, mais as que ele acrescenta. */
function clausulasAtuais(){
  var base=(window.CLAUSULAS||[]).filter(function(c){ return !(U.sem||[]).length || (U.sem||[]).indexOf(c.id)<0; });
  var extras=(U.clausulas_extra||[]);
  var todas=base.concat(extras);
  return todas.map(function(c,i){
    var t=tx(c.t), ps=(c.p||[]).map(function(p){return fill(tx(p));}).filter(function(p){return p;});
    return {id:c.id||'', t:(i+1)+' · '+fill(t), p:ps};
  });
}

/* ================= HORÁRIO DE CHEGADA (botões a partir do check-in do apê) ================= */
function horaCheckin(){ var m=/(\d{1,2})(?::?(\d{2}))?/.exec(String(U.checkin||'15h')); return m?[+m[1], +(m[2]||0)]:[15,0]; }
function montarHoras(){
  var ini=horaCheckin(), h=ini[0], mi=ini[1]>=30?30:0, atual=document.getElementById('hora_chegada').value, html='';
  while(h<24){
    var v=(h<10?'0':'')+h+':'+(mi?'30':'00');
    html+='<button type="button" data-h="'+v+'" class="'+(v===atual?'on':'')+'" onclick="setHora(this)">'+v+'</button>';
    if(mi){ h++; mi=0; } else mi=30;
  }
  html+='<button type="button" data-h="00:00" class="noite '+(atual==='00:00'?'on':'')+'" onclick="setHora(this)">'+T('meiaNoite')+'</button>';
  document.getElementById('horas').innerHTML=html;
}
function setHora(b){
  document.getElementById('hora_chegada').value=b.dataset.h;
  [].forEach.call(document.querySelectorAll('#horas button'),function(x){ x.classList.toggle('on',x===b); });
  marcarErro('c_hora',false);
}
function horaTexto(v){ return v==='00:00' ? T('meiaNoite') : v; }
function declAtuais(){
  var base=T('decl').slice();
  (U.decl_extra||[]).forEach(function(d){ base.splice(base.length-1,0,fill(tx(d))); });
  return base;
}

/* ================= WHATSAPP ================= */
function abrirWhats(waUrl){
  var app=waUrl.replace('https://wa.me/','whatsapp://send?phone=').replace('?text=','&text=');
  var t=setTimeout(function(){ if(!document.hidden) window.location.href=waUrl; },1500);
  document.addEventListener('visibilitychange',function h(){ if(document.hidden){ clearTimeout(t); document.removeEventListener('visibilitychange',h); } });
  window.location.href=app;
}
function zap(txt){ abrirWhats('https://wa.me/'+WHATS+'?text='+encodeURIComponent(txt)); }

/* ================= HOSPEDES ================= */
var DOC = [];   /* tipo de documento por hóspede: 'cpf' | 'pass' */
function lerHosp(){
  var v=[];
  for(var i=0;i<NH;i++){
    var n=document.getElementById('h_nome_'+i), c=document.getElementById('h_cpf_'+i), k=document.getElementById('h_cri_'+i), t=document.getElementById('h_tel_'+i);
    v.push({n:n?n.value:'', c:c?c.value:'', k:k?k.checked:false, t:t?t.value:'', d:DOC[i]||'cpf'});
  }
  return v;
}
function esc(s){ return (s||'').replace(/"/g,'&quot;'); }
/* Máscara do CPF: 000.000.000-00 enquanto digita. */
function mascaraCpf(el){
  var d=soDigitos(el.value).slice(0,11), s=d;
  if(d.length>9) s=d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6,9)+'-'+d.slice(9);
  else if(d.length>6) s=d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6);
  else if(d.length>3) s=d.slice(0,3)+'.'+d.slice(3);
  el.value=s;
}
function setDoc(i,tipo){ DOC[i]=tipo; var v=lerHosp(); v[i].c=''; montarHospedes(v); var el=document.getElementById('h_cpf_'+i); if(el) el.focus(); }
function montarHospedes(vals){
  vals = vals || lerHosp();
  var h='';
  for(var i=0;i<NH;i++){
    var v=vals[i]||{}; var pass=(v.d||DOC[i])==='pass'; DOC[i]=pass?'pass':'cpf';
    h+='<div class="hosp"><div class="cab"><b>'+(i===0?T('titularTit'):T('hospTit')+' '+(i+1))+'</b>'+
       (i>0?'<button class="rm" onclick="rmHosp('+i+')">'+T('remover')+'</button>':'')+'</div>'+
       '<div class="campo" id="c_h_nome_'+i+'"><label>'+T('lNome')+'</label>'+
       '<input type="text" id="h_nome_'+i+'" autocomplete="name" placeholder="'+T('phNome')+'" value="'+esc(v.n)+'">'+
       '<div class="msg">'+T('errNome')+'</div></div>';
    if(i>0) h+='<label class="crianca"><input type="checkbox" id="h_cri_'+i+'"'+(v.k?' checked':'')+' onchange="montarHospedes()"><span>'+T('crianca')+'</span></label>';
    h+='<div class="campo" id="c_h_cpf_'+i+'"><label>'+T('lDoc')+'</label>'+
       '<div class="doctipo"><button type="button" class="'+(pass?'':'on')+'" onclick="setDoc('+i+',\'cpf\')">CPF</button>'+
       '<button type="button" class="'+(pass?'on':'')+'" onclick="setDoc('+i+',\'pass\')">'+T('passaporte')+'</button></div>'+
       (pass
         ? '<input type="text" id="h_cpf_'+i+'" autocomplete="off" autocapitalize="characters" placeholder="'+T('phPass')+'" value="'+esc(v.c)+'">'
         : '<input type="text" id="h_cpf_'+i+'" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCpf(this)" value="'+esc(v.c)+'">')+
       '<div class="msg">'+(pass?T('errPass'):T('errCpf'))+'</div></div>';
    if(i===0 && U.pede_telefone) h+='<div class="campo" id="c_h_tel_0"><label>'+T('lTel')+'</label>'+
       '<input type="tel" id="h_tel_0" inputmode="tel" autocomplete="tel" placeholder="'+T('phTel')+'" value="'+esc(v.t)+'">'+
       '<div class="msg">'+T('errTel')+'</div></div>';
    h+='</div>';
  }
  document.getElementById('hospedes').innerHTML=h;
  document.querySelector('.addh').style.display = NH>=U.capacidade ? 'none' : '';
}
function addHosp(){ if(NH<U.capacidade){ var v=lerHosp(); NH++; montarHospedes(v); } }
function rmHosp(i){ var v=lerHosp(); v.splice(i,1); DOC.splice(i,1); NH--; montarHospedes(v); }

/* ================= ASSINATURA ================= */
var cv, ctx, desenhou=false, ultimo=null;
function initAssin(){
  cv=document.getElementById('cv');
  var r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(170*dpr);
  ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1B1F1C';
  function pos(e){ var b=cv.getBoundingClientRect(); var t=(e.touches&&e.touches[0])||e; return {x:t.clientX-b.left,y:t.clientY-b.top}; }
  function ini(e){ e.preventDefault(); ultimo=pos(e); desenhou=true; }
  function mov(e){ if(!ultimo) return; e.preventDefault(); var p=pos(e); ctx.beginPath(); ctx.moveTo(ultimo.x,ultimo.y); ctx.lineTo(p.x,p.y); ctx.stroke(); ultimo=p; }
  function fim(){ ultimo=null; }
  cv.addEventListener('pointerdown',ini); cv.addEventListener('pointermove',mov); window.addEventListener('pointerup',fim);
  cv.addEventListener('touchstart',ini,{passive:false}); cv.addEventListener('touchmove',mov,{passive:false}); cv.addEventListener('touchend',fim);
}
function limparAssin(){ if(ctx){ ctx.clearRect(0,0,cv.width,cv.height); desenhou=false; } }

/* ================= VALIDACAO ================= */
function marcarErro(id,mal){ var c=document.getElementById(id); if(!c) return; c.classList.toggle('mal',!!mal); var i=c.querySelector('input'); if(i) i.classList.toggle('erro',!!mal); }
function soDigitos(s){ return (s||'').replace(/\D/g,''); }
/* CPF = 11 dígitos (a máscara cuida da pontuação); passaporte = 5+ letras/números. */
function docOk(d,tipo){ d=(d||'').trim(); if(tipo==='pass') return d.replace(/[^A-Za-z0-9]/g,'').length>=5; return soDigitos(d).length===11; }

function validar(etapa){
  var primeiro=null;
  if(etapa===1){
    for(var i=0;i<NH;i++){
      var nome=document.getElementById('h_nome_'+i).value.trim();
      var doc=document.getElementById('h_cpf_'+i).value.trim();
      var cri=i>0 && document.getElementById('h_cri_'+i) && document.getElementById('h_cri_'+i).checked;
      var malN=nome.split(/\s+/).length<2||nome.length<5;
      var malC=cri ? (doc.length>0 && !docOk(doc,DOC[i])) : !docOk(doc,DOC[i]);
      marcarErro('c_h_nome_'+i,malN); marcarErro('c_h_cpf_'+i,malC);
      if(malN&&!primeiro) primeiro='h_nome_'+i;
      if(malC&&!primeiro) primeiro='h_cpf_'+i;
      if(i===0 && U.pede_telefone){
        var tel=document.getElementById('h_tel_0').value; var malT=soDigitos(tel).length<8;
        marcarErro('c_h_tel_0',malT); if(malT&&!primeiro) primeiro='h_tel_0';
      }
    }
  }
  if(etapa===2){
    var ci=document.getElementById('check_in').value, co=document.getElementById('check_out').value, ho=document.getElementById('hora_chegada').value;
    var malI=!ci, malO=!co||(ci&&co<=ci), malH=!ho;
    marcarErro('c_in',malI); marcarErro('c_out',malO); marcarErro('c_hora',malH);
    if(malI&&!primeiro) primeiro='check_in'; if(malO&&!primeiro) primeiro='check_out'; if(malH&&!primeiro) primeiro='horas';
  }
  if(etapa===3){
    var ok=document.getElementById('aceitaRegras').checked;
    document.getElementById('aceitaBox').classList.toggle('mal',!ok);
    if(!ok){ aviso(T('errRegras')); primeiro='aceitaBox'; }
  }
  if(etapa===4){
    var todos=[].slice.call(document.querySelectorAll('#declBox input'));
    var falta=todos.some(function(i){return !i.checked;});
    document.getElementById('declBox').classList.toggle('mal',falta);
    if(falta){ if(!primeiro) primeiro='declBox'; aviso(T('errDecl')); }
    else if(!desenhou){ aviso(T('errAssin')); primeiro='cv'; }
  }
  if(primeiro){ var el=document.getElementById(primeiro); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); if(el.focus&&el.tagName==='INPUT') setTimeout(function(){el.focus();},350); } return false; }
  return true;
}

function coletar(){

  return {
    hospedes:hs,
    telefone: U.pede_telefone ? soDigitos(document.getElementById('h_tel_0').value) : '',
    check_in:document.getElementById('check_in').value,

/* ================= ENVIO ================= */
function enviar(){
  if(!validar(4)) return;
  if(enviando) return;
  enviando=true;
  document.getElementById('btSegue').disabled=true;
  var d=coletar(), assinatura='';
  try{ assinatura=cv.toDataURL('image/png'); }catch(e){}
  var titular={nome:d.hospedes[0].nome, cpf:d.hospedes[0].cpf};
  if(d.telefone) titular.telefone=d.telefone;
  var payload={
    unidade:U.code, tipo:'termo', idioma:L,
    check_in:d.check_in, check_out:d.check_out, hora_chegada:d.hora_chegada, hora_chegada_texto:horaTexto(d.hora_chegada),
    titular:titular,

    placa:d.placa, assinatura:assinatura,
    aceites:{contrato:true, nao_fumar:true, sem_festas:true, capacidade:true, checkout:true}
  };
  try{ var _b=JSON.stringify(payload); if(!(navigator.sendBeacon&&navigator.sendBeacon(EP_IN,new Blob([_b],{type:'text/plain;charset=UTF-8'})))){ fetch(EP_IN,{method:'POST',keepalive:true,headers:{'Content-Type':'text/plain;charset=UTF-8'},body:_b}).catch(function(){}); } }catch(e){}

  var msg=T('zapEnvio')+'\n\n'+
    d.hospedes.map(function(x,i){return (i===0?'👤 ':'• ')+x.nome+' — '+(x.cpf||(x.crianca?'criança':'—'));}).join('\n')+
    (d.telefone?'\n📱 '+d.telefone:'')+
    '\n\n📅 '+fmt(d.check_in)+' → '+fmt(d.check_out)+'\n🕒 '+(d.hora_chegada?horaTexto(d.hora_chegada):'—')+
    (d.placa?'\n🚗 '+d.placa:'')+'\n\n✅ Regras aceitas e termo assinado.';
  mostrar(5);
  setTimeout(function(){ zap(msg); },600);
}

/* ================= NAVEGACAO ================= */
function mostrar(n){
  ETAPA=n;
  [1,2,3,4,5].forEach(function(i){ document.getElementById('e'+i).classList.toggle('on',i===n); });
  var barras=document.querySelectorAll('.prog div');
  for(var i=0;i<4;i++) barras[i].classList.toggle('on', i<Math.min(n,4));
  document.querySelector('.prog').classList.toggle('hide',n===5);
  document.getElementById('passoRot').textContent = n<5 ? (n+'/4 · '+T('passos')[n-1]) : '';
  document.getElementById('btVolta').classList.toggle('hide',n===1||n===5);
  document.getElementById('navBar').classList.toggle('hide',n===5);
  var bt=document.getElementById('btSegue');
  bt.textContent = n===4?T('btEnviar'):T('btSegue');
  bt.className = n===4?'enviar':'segue';
  bt.onclick = n===4?enviar:avancar;
  if(INICIADO){ var pn=document.querySelector('.painel'); window.scrollTo({top:pn?pn.offsetTop-14:0,behavior:'auto'}); }
  INICIADO=true;
  if(n===4){ montarDecl(); montarResumo(); if(!ctx) setTimeout(initAssin,60); }
}
function avancar(){ if(!validar(ETAPA)) return; mostrar(ETAPA+1); }
function voltar(){ if(ETAPA>1) mostrar(ETAPA-1); }

/* ================= IDIOMA ================= */
function aplicarIdioma(){
  document.documentElement.lang = L==='pt'?'pt-BR':L;
  [].forEach.call(document.querySelectorAll('[data-t]'),function(e){ var v=T(e.dataset.t); if(typeof v==='string') e.innerHTML=v; });
  [].forEach.call(document.querySelectorAll('[data-ph]'),function(e){ e.placeholder=T(e.dataset.ph); });
  document.getElementById('subPag').textContent=T('subPag');
  document.getElementById('chipUn').textContent=tx(U.predio)+' · '+tx(U.unidade);
  document.getElementById('limite').textContent=T('limite');
  document.getElementById('e2lead').textContent=T('e2lead')+(U.pede_placa?T('e2placa'):'');
  document.getElementById('dicaHora').textContent=T('dicaHora');
  document.getElementById('e3lead').textContent=T('e3lead');
  document.getElementById('okP').textContent=T('okP');
  document.getElementById('c_placa').classList.toggle('hide',!U.pede_placa);
  var g=document.getElementById('okGuia'); if(U.guia){ g.href=BASE+U.guia; g.classList.remove('hide'); } else g.classList.add('hide');
  montarHospedes(); montarHoras(); montarClausulas(); montarDecl();
  [].forEach.call(document.querySelectorAll('.lang button'),function(b){ b.classList.toggle('on',b.dataset.l===L); });
  mostrar(ETAPA);
}
if(U){
  [].forEach.call(document.querySelectorAll('.lang button'),function(b){
    b.onclick=function(){ L=b.dataset.l; try{localStorage.setItem('alugo_lang',L);}catch(e){} aplicarIdioma(); };
  });
  (function init(){
    var s=null; try{ s=localStorage.getItem('alugo_lang'); }catch(e){}
    if(!s){ var n=(navigator.language||'pt').slice(0,2); s=(n==='en'||n==='es')?n:'pt'; }
    L=s;
    var hoje=new Date().toISOString().slice(0,10);
    document.getElementById('check_in').min=hoje; document.getElementById('check_out').min=hoje;
    document.getElementById('check_in').addEventListener('change',function(){ document.getElementById('check_out').min=this.value; });
    aplicarIdioma();
  })();
  (function(){ var b=document.getElementById('barraLang'); function f(){ b.classList.toggle('solto',window.scrollY>70); } f(); window.addEventListener('scroll',f,{passive:true}); })();
}
</script>
