<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DNA SmartStyle 1008B · aluGO</title>
<meta name="theme-color" content="#F7F2EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..100;1,9..144,300..600,30..100&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ════════ DESIGN TOKENS · DNA SmartStyle ════════ */
:root{
  --bg:#F7F2EC; --card:#FFFFFF; --card-2:#FBF6F0; --tint:#F1E7DC;
  --ink:#1E1B18; --ink-2:#5B5249; --ink-3:#8E8277; --ink-4:#BEB3A7;
  --dna:#E0761A; --dna-hi:#F49B3E; --dna-lo:rgba(224,118,26,.09); --dna-mid:rgba(224,118,26,.22);
  --rule:rgba(30,27,24,.10); --rule-hi:rgba(224,118,26,.30);
  --alert:#C0392B; --alert-lo:rgba(192,57,43,.08);
  --wpp:#1FAA53; --wpp-hi:#25D366;
  --bar-h:64px;
  --fdisplay:'Fraunces',Georgia,serif; --fbody:'Manrope',system-ui,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fbody);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom))}
img{max-width:100%;display:block}
button{font-family:inherit}
.ico{width:20px;height:20px;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0}
.ico-sm{width:15px;height:15px} .ico-lg{width:26px;height:26px}

/* ════════ CAPA ════════ */
header{position:relative;padding:26px 20px 30px;text-align:center;background:
  radial-gradient(ellipse 70% 55% at 50% 0%, rgba(224,118,26,.13) 0%, transparent 70%), var(--card-2);
  border-bottom:1px solid var(--rule);overflow:hidden}
.lang{position:absolute;top:14px;right:14px;display:flex;gap:3px;background:rgba(255,255,255,.8);
  border:1px solid var(--rule);border-radius:20px;padding:3px;backdrop-filter:blur(8px);z-index:5}
.lang button{border:none;background:none;cursor:pointer;font-size:.62rem;font-weight:700;letter-spacing:1px;
  color:var(--ink-3);padding:5px 9px;border-radius:16px;transition:.2s}
.lang button.on{background:var(--dna);color:#fff}
.h-logo{height:74px;width:auto;margin:6px auto 18px;object-fit:contain}
.h-unit{font-family:var(--fdisplay);font-variation-settings:"opsz" 144,"SOFT" 90;font-weight:300;
  font-size:clamp(3rem,15vw,4.6rem);line-height:.86;letter-spacing:-.03em}
.h-kicker{font-size:.62rem;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--dna);margin-bottom:8px}
.h-meta{margin-top:14px;font-size:.66rem;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;color:var(--ink-3)}

/* ════════ CARTÕES INSTANTÂNEOS ════════ */
.instant{max-width:640px;margin:-14px auto 0;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:4}
.ins{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:15px 14px;cursor:pointer;
  box-shadow:0 6px 20px rgba(30,27,24,.07);transition:.2s;text-align:left;position:relative;overflow:hidden}
.ins:active{transform:scale(.985)}
.ins-k{display:flex;align-items:center;gap:6px;font-size:.55rem;font-weight:800;letter-spacing:1.8px;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.ins-k .ico{width:14px;height:14px;color:var(--dna)}
.ins-v{font-family:var(--fdisplay);font-variation-settings:"opsz" 72,"SOFT" 60;font-weight:600;
  font-size:1.45rem;letter-spacing:.02em;color:var(--ink);word-break:break-word;line-height:1.15}
.ins-v.sm{font-size:1.02rem}
.ins-sub{font-size:.7rem;color:var(--ink-3);margin-top:4px}
.ins.copied{border-color:var(--wpp);background:rgba(31,170,83,.06)}
.ins-tag{position:absolute;top:11px;right:12px;font-size:.5rem;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;color:var(--ink-4)}
.ins.copied .ins-tag{color:var(--wpp)}

/* ════════ BUSCA ════════ */
.searchwrap{max-width:640px;margin:14px auto 0;padding:0 16px;position:relative}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule);
  border-radius:14px;padding:13px 15px}
.search input{flex:1;border:none;outline:none;background:none;font-family:var(--fbody);font-size:.92rem;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--ink-4)}
.search .ico{color:var(--dna)}
.results{margin-top:8px;display:none}
.results.on{display:block}
.res{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--rule);
  border-radius:12px;padding:12px 14px;margin-bottom:7px;cursor:pointer;transition:.15s}
.res:active{background:var(--tint)}
.res .ico{color:var(--dna)}
.res-t{font-weight:700;font-size:.88rem}
.res-s{font-size:.75rem;color:var(--ink-3)}
.res-empty{padding:16px;text-align:center;color:var(--ink-3);font-size:.85rem}

/* ════════ GRADE DE TELAS ════════ */
.grid{max-width:640px;margin:18px auto 30px;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:17px 15px 15px;
  cursor:pointer;text-align:left;transition:.18s;position:relative;overflow:hidden;min-height:104px;
  display:flex;flex-direction:column;justify-content:space-between}
.tile:active{transform:scale(.985);background:var(--card-2)}
.tile .ico{color:var(--dna);margin-bottom:10px}
.tile-n{position:absolute;top:12px;right:14px;font-family:var(--fdisplay);font-size:.72rem;color:var(--ink-4);font-feature-settings:"lnum"}
.tile-t{font-weight:700;font-size:.94rem;line-height:1.25;letter-spacing:-.01em}
.tile-s{font-size:.72rem;color:var(--ink-3);margin-top:3px;line-height:1.4}
.tile.alerta{border-color:rgba(192,57,43,.35);background:var(--alert-lo)}
.tile.alerta .ico{color:var(--alert)}
.tile.saida{grid-column:span 2;background:linear-gradient(135deg,#22b95c 0%,#1FAA53 100%);border-color:#199447;min-height:auto;
  box-shadow:0 6px 20px rgba(31,170,83,.30)}
.tile.saida .ico,.tile.saida .tile-t,.tile.saida .tile-s{color:#fff}
.tile.saida .tile-s{opacity:.9}
.tile.saida::after{content:'';position:absolute;inset:-4px;border-radius:20px;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(31,170,83,.42) 0%,transparent 68%);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.985)}50%{opacity:.75;transform:scale(1.04)}}

/* ════════ TELA ════════ */
.screen{position:fixed;inset:0;background:var(--bg);z-index:900;overflow-y:auto;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.16,1,.3,1);
  padding-bottom:calc(var(--bar-h) + 24px + env(safe-area-inset-bottom))}
.screen.on{transform:none}
.sc-top{position:sticky;top:0;background:rgba(247,242,236,.94);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--rule);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:2}
.sc-back{border:none;background:var(--card);border:1px solid var(--rule);border-radius:11px;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.sc-ttl{font-weight:700;font-size:.95rem;letter-spacing:-.01em}
.sc-body{max-width:640px;margin:0 auto;padding:22px 16px 30px}
.sc-h{font-family:var(--fdisplay);font-variation-settings:"opsz" 110,"SOFT" 70;font-weight:400;
  font-size:clamp(1.9rem,7vw,2.5rem);line-height:1.06;letter-spacing:-.02em;margin-bottom:8px}
.sc-h em{font-style:italic;color:var(--dna)}
.sc-lead{color:var(--ink-2);font-size:.92rem;margin-bottom:22px}

.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:18px 16px;margin-bottom:12px}
.card-t{display:flex;align-items:center;gap:9px;font-size:.6rem;font-weight:800;letter-spacing:2.4px;
  text-transform:uppercase;color:var(--dna);margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--rule)}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:none;padding-bottom:0}
.row:first-of-type{padding-top:0}
.row>.ico{color:var(--dna);margin-top:1px}
.row-h{font-weight:700;font-size:.9rem;margin-bottom:2px}
.row-b{color:var(--ink-2);font-size:.85rem;line-height:1.6}
.row-b strong{color:var(--ink);font-weight:700}

.big{background:var(--card);border:1px solid var(--rule-hi);border-radius:16px;padding:22px 18px;text-align:center;margin-bottom:12px}
.big-k{font-size:.58rem;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.big-v{font-family:var(--fdisplay);font-variation-settings:"opsz" 100,"SOFT" 60;font-weight:600;
  font-size:2.5rem;color:var(--dna);letter-spacing:.04em;font-feature-settings:"lnum";line-height:1}
.big-s{font-size:.8rem;color:var(--ink-3);margin-top:8px}

.note{display:flex;gap:11px;align-items:flex-start;background:var(--dna-lo);border-left:3px solid var(--dna);
  border-radius:0 12px 12px 0;padding:13px 15px;font-size:.85rem;color:var(--ink-2);line-height:1.6;margin-bottom:12px}
.note>.ico{color:var(--dna);margin-top:1px}
.note strong{color:var(--ink)}
.note.danger{background:var(--alert-lo);border-left-color:var(--alert)}
.note.danger>.ico{color:var(--alert)}
.note.ok{background:rgba(31,170,83,.08);border-left-color:var(--wpp)}
.note.ok>.ico{color:var(--wpp)}

.steps{counter-reset:s}
.step{display:flex;gap:12px;padding:11px 0;border-bottom:1px dotted var(--rule)}
.step:last-child{border-bottom:none;padding-bottom:0}
.step::before{counter-increment:s;content:counter(s);flex-shrink:0;width:23px;height:23px;border-radius:50%;
  background:var(--dna-lo);border:1px solid var(--rule-hi);color:var(--dna);display:flex;align-items:center;
  justify-content:center;font-size:.64rem;font-weight:800;font-feature-settings:"lnum"}
.step div{font-size:.86rem;color:var(--ink-2);line-height:1.55}
.step strong{color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--tint);border:1px solid var(--rule);border-radius:20px;padding:7px 13px;font-size:.78rem;font-weight:600;color:var(--ink-2)}

.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.yn>div{border-radius:14px;padding:15px 14px;border:1px solid var(--rule)}
.yn .si{background:rgba(31,170,83,.07);border-color:rgba(31,170,83,.3)}
.yn .nao{background:var(--alert-lo);border-color:rgba(192,57,43,.3)}
.yn h4{font-size:.56rem;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:9px}
.yn .si h4{color:var(--wpp)} .yn .nao h4{color:var(--alert)}
.yn li{list-style:none;font-size:.8rem;color:var(--ink-2);padding:4px 0 4px 15px;position:relative;line-height:1.45}
.yn .si li::before{content:'✓';position:absolute;left:0;color:var(--wpp);font-weight:800}
.yn .nao li::before{content:'✕';position:absolute;left:0;color:var(--alert);font-weight:800}

.acc{border:1px solid var(--rule);border-radius:14px;overflow:hidden;margin-bottom:9px;background:var(--card)}
.acc-h{display:flex;align-items:center;gap:11px;padding:15px;cursor:pointer;font-weight:700;font-size:.88rem}
.acc-h .ico{color:var(--alert)}
.acc-h .arrow{margin-left:auto;transition:transform .25s;color:var(--ink-3)}
.acc.on .arrow{transform:rotate(180deg)}
.acc-c{max-height:0;overflow:hidden;transition:max-height .3s ease}
.acc.on .acc-c{max-height:620px}
.acc-in{padding:0 15px 15px;font-size:.85rem;color:var(--ink-2);line-height:1.65}
.acc-in strong{color:var(--ink)}

.check{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--rule);cursor:pointer;user-select:none}
.check:last-child{border-bottom:none;padding-bottom:0}
.check:first-child{padding-top:0}
.box{width:21px;height:21px;flex-shrink:0;border:1.6px solid var(--ink-4);border-radius:6px;margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:.2s}
.check.done .box{background:var(--dna);border-color:var(--dna)}
.tick{display:none;color:#fff} .check.done .tick{display:flex}
.tick svg{width:12px;height:12px;stroke-width:3}
.check-t{font-size:.88rem;line-height:1.5}
.check.done .check-t{color:var(--ink-3);text-decoration:line-through}

.ta{width:100%;min-height:110px;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:13px;
  font-family:var(--fbody);font-size:15px;color:var(--ink);outline:none;resize:vertical;line-height:1.55}
.ta:focus{border-color:var(--dna)}
.lbl{display:block;font-size:.58rem;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}

.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px;border:none;
  border-radius:12px;font-size:.72rem;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;
  cursor:pointer;text-decoration:none;margin-top:14px;transition:.15s}
.btn-p{background:var(--dna);color:#fff}
.btn-p:active{transform:scale(.985)}
.btn-o{background:var(--card);color:var(--dna);border:1px solid var(--rule-hi)}
.btn-w{background:var(--wpp);color:#fff}

.co{background:var(--card);border:1px solid var(--rule-hi);border-radius:18px;padding:24px 18px;text-align:center}
.co-seal{display:inline-flex;align-items:center;gap:6px;background:var(--alert-lo);border:1px solid rgba(192,57,43,.28);
  border-radius:20px;padding:5px 13px;font-size:.53rem;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--alert);margin-bottom:14px}
.co-t{font-family:var(--fdisplay);font-weight:500;font-size:1.6rem;margin-bottom:9px;line-height:1.15}
.co-d{font-size:.86rem;color:var(--ink-2);line-height:1.65;margin-bottom:20px}
.co-wrap{position:relative;display:inline-block;width:100%;max-width:330px}
.co-btn{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:19px;background:linear-gradient(180deg,#2fd968 0%,#25D366 55%,#1fb457 100%);color:#06240f;border:none;
  border-bottom:4px solid #148a3f;border-radius:14px;font-size:.78rem;font-weight:800;letter-spacing:1.6px;
  text-transform:uppercase;cursor:pointer;box-shadow:0 6px 0 rgba(11,90,42,.5),0 12px 26px rgba(37,211,102,.26);
  transition:transform .09s,box-shadow .09s,border-bottom-width .09s}
.co-btn:active{transform:translateY(5px);border-bottom-width:1px;box-shadow:0 1px 0 rgba(11,90,42,.5)}
.co-wrap::after{content:'';position:absolute;inset:-6px;border-radius:20px;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(37,211,102,.4) 0%,transparent 68%);animation:pulse 2.6s ease-in-out infinite}
.co-done{display:none;margin-top:16px;font-size:.85rem;color:var(--wpp);font-weight:700}
.co-done.on{display:block}
.co-f{margin-top:16px;font-size:.75rem;color:var(--ink-3);line-height:1.55}

/* ════════ BARRA FIXA ════════ */
.bar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.95);backdrop-filter:blur(18px);
  border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px;
  align-items:center;padding-left:12px;padding-right:12px;z-index:950}
.bar button{border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:.56rem;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);padding:8px 0}
.bar .ico{width:19px;height:19px}
.bar .co-mini{background:var(--wpp);color:#fff;border-radius:12px;padding:11px 8px;flex-direction:row;gap:7px;
  box-shadow:0 3px 10px rgba(31,170,83,.3)}
.bar .co-mini .ico{color:#fff}

footer{text-align:center;padding:26px 20px 34px;border-top:1px solid var(--rule);background:var(--card-2)}
.f-logo{height:26px;margin:0 auto 10px;opacity:.75;filter:grayscale(1) brightness(.35)}
.f-t{font-size:.72rem;color:var(--ink-3);line-height:1.6}

@media(max-width:360px){.instant,.grid{grid-template-columns:1fr}.tile.saida{grid-column:span 1}}
</style>
</head>
<body>

<header>
  <div class="lang">

 apto_p_1:'<strong>Toque na tela</strong> da fechadura para acender os números.',
 apto_p_2:'Digite <strong>134679</strong> e finalize com <strong>*</strong> (asterisco).',
 apto_p_3:'A fechadura destrava sozinha. <strong>Gire a maçaneta e empurre.</strong>',
 apto_p_4:'Ao sair, a porta tranca sozinha — mas <strong>confira sempre se ficou fechada</strong>.',
 apto_n1:'Se a tela não acender, apoie a palma da mão sobre ela por um segundo. O sensor precisa detectar o toque antes de mostrar o teclado.',
 apto_n2:'Errar a senha várias vezes seguidas <strong>bloqueia a fechadura por 1 minuto</strong>. Se acontecer, espere e digite de novo com calma — não force a porta.',

 casa_t:'O apartamento', casa_s:'Ambientes e comodidades',
 casa_h:'O <em>apartamento</em>', casa_lead:'Um quarto, para até 3 pessoas.',
 casa_sala_t:'Sala e jantar', casa_sala_b:'Sofá de canto retrátil que <strong>vira cama de solteiro</strong>, mesa para 4, TV grande com streaming e cortina blackout. O ar-condicionado da sala é independente do quarto.',
 casa_quarto_t:'Quarto', casa_quarto_b:'Cama de casal, closet com portas espelhadas, bancada que funciona como escrivaninha e ar-condicionado próprio. A iluminação embutida na parede tem interruptor ao lado da cama.',
 casa_banho_t:'Banheiro', casa_banho_b:'Box de vidro, ducha, bancada de granito e espelho iluminado. <strong>Toalhas e roupa de cama já estão no armário</strong>, prontas para uso.',
 casa_varanda_t:'Varandas', casa_varanda_b:'São duas: uma lateral e outra com vista aberta da cidade. O Wi-Fi 2.0 alcança melhor lá fora que o 5.0.',
 casa_220:'Todas as tomadas do apartamento são <strong>220V</strong>, padrão de Goiás. Confira a voltagem de secador de cabelo, chapinha e carregadores antes de ligar.',
 casa_tv_t:'TV e streaming', casa_tv_b:'A TV já está logada na Netflix. Use o controle da própria TV — o app abre na tela inicial. <strong>Não desconecte a conta</strong> ao sair.',
 casa_ar_t:'Ar-condicionado', casa_ar_b:'Cada ambiente tem o seu, com controle próprio. Mantenha <strong>portas e janelas fechadas</strong> enquanto estiver ligado e desligue ao sair do apartamento.',
 casa_lixo_t:'Onde jogar o lixo', casa_lixo_b:'As lixeiras do condomínio ficam no <strong>térreo, no subsolo 1 e no subsolo 2</strong>, sempre perto dos elevadores. Não deixe sacos no corredor nem na porta.',
 casa_n1:'Faltou alguma coisa — toalha extra, cobertor, travesseiro? Chame no WhatsApp que a gente resolve no mesmo dia.',

 cozinha_t:'Cozinha', cozinha_s:'Equipada de verdade',
 cozinha_h:'Dá para <em>cozinhar</em>', cozinha_lead:'A cozinha é completa, não é só para esquentar comida.',
 cozinha_chips:'Cooktop 4 bocas|Coifa|Geladeira frost free|Air fryer|Cafeteira|Processador|Panela de pressão|Purificador de água|Panelas|Louça completa|Taças|Talheres|Balança|Tábua e facas',
 cozinha_cook_t:'Cooktop e coifa', cozinha_cook_b:'Gire o botão e segure alguns segundos até a chama firmar. <strong>Ligue a coifa sempre que cozinhar</strong> — o apartamento é integrado e o cheiro fica.',
 cozinha_agua_t:'Água para beber', cozinha_agua_b:'Use o <strong>purificador</strong> ao lado da pia. A água da torneira é tratada, mas o purificador deixa o sabor melhor e sai gelada.',
 cozinha_caf_t:'Café', cozinha_caf_b:'A cafeteira fica na bancada e os filtros no armário superior. <strong>Se faltar pó de café</strong>, avise no WhatsApp que levamos.',
 cozinha_n1:'Louça suja não é problema, mas pedimos que <strong>não deixe comida na pia nem na geladeira</strong> ao ir embora — atrai insetos entre uma reserva e outra.',

 lazer_t:'Piscina e lazer', lazer_s:'Rooftop, academia e mais',
 lazer_h:'As <em>áreas</em> do prédio', lazer_lead:'O rooftop tem piscina de borda infinita com vista para o Parque Vaca Brava.',
 lazer_regra:'<strong>Regra do condomínio — leia antes de descer.</strong> De <strong>sexta a domingo</strong>, a piscina e o espaço gourmet são liberados apenas para estadias de <strong>três noites ou mais</strong>. De segunda a quinta não há restrição. Academia e salão de jogos ficam liberados todos os dias, sem exceção.',
 lazer_pisc_t:'Piscina no rooftop', lazer_pisc_b:'Borda infinita, com deck e vista aberta. O pôr do sol sobre o Parque Vaca Brava é o melhor horário. Leve a sua toalha do apartamento — a piscina não fornece.',
 lazer_acad_t:'Academia', lazer_acad_b:'Liberada todos os dias, sem restrição de estadia. Use roupa e tênis adequados.',
 lazer_jogos_t:'Salão de jogos', lazer_jogos_b:'Sinuca e mesa de poker. Liberado todos os dias.',
 lazer_gour_t:'Espaço gourmet', lazer_gour_b:'Com churrasqueira. Segue a mesma regra da piscina no fim de semana.',
 lazer_n1:'<strong>Salão de festas:</strong> não é disponibilizado para hospedagem por temporada, mesmo mediante pagamento.',
 lazer_n2:'As regras e horários das áreas comuns são do condomínio, não da aluGO — a portaria pode pedir a confirmação da sua reserva na entrada.',

 lavar_t:'Lava e seca', lavar_s:'Sair com a mala limpa',
 lavar_h:'A <em>lava e seca</em>', lavar_lead:'Samsung, na área de serviço. Lava e seca no mesmo ciclo.',
 lavar_p_1:'Coloque a roupa <strong>sem encher o tambor</strong> — deixe um palmo livre no topo, senão não seca direito.',
 lavar_p_2:'Sabão líquido na gaveta da esquerda, amaciante na do meio (a marcada com a flor).',
 lavar_p_3:'Ligue no botão de energia e escolha o programa. Para o dia a dia, <strong>"Rápido"</strong> resolve.',
 lavar_p_4:'Para lavar <strong>e</strong> secar, aperte a tecla de <strong>secagem</strong> antes de iniciar e escolha o tempo.',
 lavar_p_5:'Toque em <strong>Iniciar</strong>. A porta trava durante o ciclo e destrava sozinha ao final.',
 lavar_n1:'Ciclo completo com secagem leva cerca de <strong>3 horas</strong>. Programe pensando no seu horário de saída.',
 lavar_n2:'<strong>Não seque</strong> peças delicadas, com elastano ou estampa emborrachada — a secadora encolhe e descola. Na dúvida, use o varal.',

 regras_t:'Regras da casa', regras_s:'O combinado',
 regras_h:'O <em>combinado</em>', regras_lead:'São poucas e todas estão no termo que você assinou.',
 regras_fumo:'<strong>Proibido fumar em qualquer ambiente interno</strong> — inclui cigarro eletrônico, vape e narguilé, também nas varandas. O cheiro impregna no tecido e no gesso, e a higienização é cobrada.',
 regras_si:'Receber visita durante o dia|Cozinhar à vontade|Usar academia e salão de jogos todos os dias|Levar sua toalha para a piscina|Estender roupa na área de serviço',
 regras_nao:'Fumar em qualquer ambiente|Festas ou eventos|Animais de estimação|Exceder 3 hóspedes|Barulho após as 22h|Retirar móveis ou decoração do lugar',
 m_fumo_t:'Fumar no apartamento', m_fumo_b:'<strong>R$ 300,00</strong> mais o custo da higienização completa do ambiente.',
 m_festa_t:'Festa ou evento', m_festa_b:'<strong>R$ 500,00</strong> mais o reparo de eventuais danos e a devolução das diárias restantes.',
 m_exc_t:'Hóspede além da capacidade', m_exc_b:'<strong>R$ 200,00</strong> por pessoa excedente. A capacidade é de 3 pessoas e a portaria controla pelo cadastro.',
 m_late_t:'Saída após as 12h', m_late_b:'<strong>R$ 200,00</strong> por hora. Há reserva chegando no mesmo dia e a limpeza entra pontualmente.',
 regras_n1:'<strong>Silêncio após as 22h</strong> é regimento do condomínio, não regra nossa. Reclamação de vizinho vira advertência formal ao proprietário.',

 problema_t:'Deu problema?', problema_s:'Resolva em 1 minuto',
 problema_h:'Antes de <em>chamar</em>', problema_lead:'Quase tudo se resolve aqui. Se não resolver, é só tocar no botão do fim.',
 pb1_t:'Acabou a energia', pb1_b:'Confira primeiro se é só o apartamento: olhe pela janela se os prédios vizinhos estão acesos. Se for só aqui, procure o <strong>quadro de disjuntores</strong> — costuma ficar na parte alta da parede, perto da entrada ou da área de serviço. Ache a chave que caiu para baixo, desligue todas, religue essa primeiro e depois as demais. Se cair de novo ao ligar um aparelho, o problema é o aparelho.',
 pb2_t:'Chuveiro sem água quente', pb2_b:'O chuveiro é elétrico. Verifique se a chave do <strong>disjuntor do chuveiro</strong> está ligada no quadro. Depois, confira se o registro está aberto por completo — com pouca pressão o aquecimento não liga. A posição "inverno" esquenta mais e reduz o volume de água.',
 pb3_t:'O ar não está gelando', pb3_b:'Confira se está no modo <strong>Cool / Refrigerar</strong> (o floco de neve) e não em ventilação. Ajuste para 23°C. Feche portas e janelas do ambiente. Se ficar 20 minutos e não gelar, nos chame — pode ser falta de gás e é manutenção nossa.',
 pb4_t:'Wi-Fi caiu', pb4_b:'O roteador fica na sala, normalmente junto ao painel da TV. <strong>Tire da tomada, conte até 30 e ligue de novo</strong> — leva cerca de 2 minutos para voltar. Se o seu aparelho continuar sem conectar, tente a rede <strong>Smart T 2.0</strong> (senha veiga4080), que alcança mais longe.',
 pb5_t:'A fechadura não abre', pb5_b:'Digite <strong>134679</strong> e depois o <strong>*</strong> — o asterisco é o que confirma. Se errar 5 vezes, ela bloqueia por 1 minuto: espere e tente de novo. Se a tela nem acender, as pilhas podem ter acabado — nos chame imediatamente que resolvemos na hora, não force a porta.',
 pb6_t:'Vazamento ou entupimento', pb6_b:'Feche o registro mais próximo (embaixo da pia ou atrás do vaso) e <strong>nos avise na hora</strong>. Não tente desentupir com produto químico — pode danificar a tubulação e a responsabilidade passa a ser sua.',
 problema_n1:'Emergência de gás, incêndio ou elevador: acione a <strong>portaria pelo interfone</strong> primeiro, é mais rápido que qualquer mensagem.',
 problema_btn:'Falar com a aluGO agora',

 bairro_t:'Setor Bueno', bairro_s:'O que tem por perto',
 bairro_h:'O <em>bairro</em>', bairro_lead:'Você está num dos melhores endereços de Goiânia — dá para resolver tudo a pé.',
 b_parque_t:'Parque Vaca Brava', b_parque_b:'Cerca de 10 minutos a pé. Pista de caminhada, lago e feira aos domingos de manhã. É a mesma vista que se enxerga da piscina.',
 b_rest_t:'Restaurantes e bares', b_rest_b:'A T-37 e a Av. T-10 concentram a maior parte. Do café da manhã ao bar de fim de noite, tudo num raio de 10 minutos a pé.',
 b_merc_t:'Mercado e farmácia', b_merc_b:'Há supermercado e farmácia 24 horas a poucos quarteirões. Para compra grande, os aplicativos de entrega atendem o prédio normalmente.',
 b_shop_t:'Shoppings', b_shop_b:'Flamboyant e Bougainville ficam a poucos minutos de carro.',
 b_app_t:'Aplicativos de transporte', b_app_b:'Uber e 99 atendem muito bem a região, com espera curta em qualquer horário.',
 b_aero_t:'Aeroporto e rodoviária', b_aero_b:'O Aeroporto Santa Genoveva fica a cerca de 20 a 30 minutos de carro; a rodoviária, a cerca de 15. Considere o trânsito no fim da tarde.',
 bairro_n1:'Quer indicação de restaurante para uma ocasião específica? Chame no WhatsApp — a gente conhece o bairro e indica de verdade.',

 checkin_t:'Check-in e vistoria', checkin_s:'Cadastro e chegada',
 checkin_h:'Check-in <em>online</em>', checkin_lead:'É o cadastro que libera a sua entrada na portaria.',
 checkin_alerta:'<strong>Preenchimento obrigatório.</strong> Sem ele a recepção não cadastra o reconhecimento facial e não autoriza a sua subida. Além disso, é exigência legal para hospedagem por temporada. Leva cerca de 2 minutos.',
 checkin_btn:'Preencher o check-in online',
 vist_intro:'Ao chegar, dê uma volta rápida pelo apartamento. Isso <strong>protege você</strong>: o que for registrado agora não pode ser cobrado depois.',
 vist_itens:'Paredes, portas e móveis sem avarias|Louças, taças e talheres completos|Toalhas e roupa de cama no armário|Ar-condicionado gelando nos dois ambientes|TV, Wi-Fi e chuveiro funcionando|Nada quebrado, manchado ou faltando',
 vist_lbl:'Encontrou algo fora do lugar?',
 vist_ph:'Ex.: mancha na parede ao lado da TV, taça trincada no armário...',
 vist_btn:'Enviar a vistoria',
 vist_n1:'<strong>Não encontrou nada?</strong> Não precisa enviar. Sem mensagem nas primeiras horas, consideramos que estava tudo em ordem.',

 saida_t:'Ir embora', saida_s:'Avise seu check-out',
 saida_h:'Hora de <em>ir</em>', saida_lead:'Rápido e sem burocracia — nada para devolver na recepção.',
 saida_hora:'Há reserva chegando hoje e a limpeza entra pontualmente nesse horário.',
 saida_itens:'Desligar os dois ares-condicionados e as luzes|Fechar as janelas e as portas das varandas|Retirar a comida da geladeira|Levar o lixo até a lixeira do prédio|Conferir carregadores, tomadas e as gavetas do closet|Puxar a porta e confirmar que trancou',
 saida_lixo:'As lixeiras ficam no <strong>térreo, no subsolo 1 e no subsolo 2</strong>, perto dos elevadores. Não deixe sacos no corredor.',
 co_selo:'⚠ Antes de ir embora',
 co_tit:'Confirme seu check-out',
 co_desc:'É esse aviso que libera nossa equipe de limpeza a preparar o apartamento. Um toque só — e a sua estadia fica registrada como encerrada.',
 co_btn:'Avisar meu check-out',
 co_ok:'✓ Check-out registrado. Boa viagem!',
 co_pe:'Não é preciso devolver chave ou cartão. A fechadura tranca sozinha e a senha é trocada entre as reservas.',
 saida_n1:'Foi tudo bem? Uma avaliação sincera ajuda muito e leva menos de um minuto. Obrigado por escolher a aluGO — esperamos receber você de novo.'
},

 chegar_t:'Getting here', chegar_s:'Address and map',
 chegar_h:'Where we <em>are</em>', chegar_lead:'Tower B of DNA SmartStyle, in the heart of Setor Bueno.',
 chegar_hor:'Check-in from <strong>3:00 pm</strong> · Check-out by <strong>12:00 pm</strong>',
 chegar_btn:'Open in Google Maps',
 chegar_n1:'<strong>The building has more than one tower.</strong> Yours is <strong>Tower B</strong> — the apartment is 1008 <strong>B</strong>. Say so at reception to avoid the wrong tower.',
 chegar_n2:'If you are using a ride app, ask to be dropped at the pedestrian entrance on R. T-37. Cars use the side ramp.',

 predio_t:'Entering the building', predio_s:'Reception and face ID',
 predio_h:'The <em>reception</em>', predio_lead:'Staffed 24 hours. Your first entry takes one extra step.',
 predio_alerta:'<strong>Without the completed online check-in, reception will not let you in.</strong> That form is how your details reach the front desk before you arrive. If you have not done it yet, do it now — it takes 2 minutes.',
 predio_p_1:'Go to the front desk and <strong>show a photo ID</strong> (passport or driver licence).',
 predio_p_2:'Reception checks your name against the list from the online check-in and <strong>registers your face ID right there</strong>.',
 predio_p_3:'From then on you come and go on your own — <strong>your face opens the gate</strong>, no card or key needed.',
 predio_p_4:'Take the <strong>Tower B</strong> lift up to the <strong>10th floor</strong>.',
 predio_n1:'Every guest must register their face, including anyone arriving later. Nobody outside the online check-in list will be allowed upstairs.',
 predio_btn:'Go to the online check-in',

 apto_t:'Getting inside', apto_s:'Door lock code',
 apto_h:'The door <em>code</em>', apto_lead:'Digital lock. There is no key to collect or return.',
 apto_big:'including the asterisk at the end',
 apto_copiar:'Copy the code',
 apto_p_1:'<strong>Touch the lock screen</strong> to wake up the keypad.',
 apto_p_2:'Type <strong>134679</strong> and finish with <strong>*</strong> (asterisk).',
 apto_p_3:'The lock releases on its own. <strong>Turn the handle and push.</strong>',
 apto_p_4:'It locks itself when the door closes — but <strong>always check it shut properly</strong>.',
 apto_n1:'If the screen stays dark, rest your palm on it for a second. The sensor needs to feel the touch before showing the keypad.',
 apto_n2:'Several wrong attempts in a row <strong>lock the keypad for 1 minute</strong>. If that happens, wait and type again slowly — do not force the door.',

 casa_t:'The apartment', casa_s:'Rooms and amenities',
 casa_h:'The <em>apartment</em>', casa_lead:'One bedroom, sleeps up to 3.',
 casa_sala_t:'Living and dining', casa_sala_b:'Corner sofa that <strong>folds out into a single bed</strong>, table for 4, large TV with streaming and blackout curtains. The living-room air conditioning is separate from the bedroom.',
 casa_quarto_t:'Bedroom', casa_quarto_b:'Double bed, mirrored closet, a counter that works as a desk and its own air conditioning. The wall lighting has a switch beside the bed.',
 casa_banho_t:'Bathroom', casa_banho_b:'Glass shower box, granite counter and lit mirror. <strong>Towels and bed linen are already in the closet</strong>, ready to use.',
 casa_varanda_t:'Balconies', casa_varanda_b:'There are two: one at the side and one with an open city view. The 2.0 Wi-Fi reaches outside better than the 5.0.',
 casa_220:'Every socket here is <strong>220V</strong>, the standard in Goiás. Check hair dryers, straighteners and chargers before plugging in.',
 casa_tv_t:'TV and streaming', casa_tv_b:'The TV is already signed in to Netflix. Use the TV remote — the app opens on the home screen. <strong>Please do not log the account out</strong> when you leave.',
 casa_ar_t:'Air conditioning', casa_ar_b:'Each room has its own unit and remote. Keep <strong>doors and windows shut</strong> while it runs, and switch it off when you leave the apartment.',
 casa_lixo_t:'Where to take the rubbish', casa_lixo_b:'The bins are on the <strong>ground floor and on basement levels 1 and 2</strong>, always next to the lifts. Please do not leave bags in the corridor or by the door.',
 casa_n1:'Missing something — an extra towel, a blanket, a pillow? Message us on WhatsApp and we will bring it the same day.',

 cozinha_t:'Kitchen', cozinha_s:'Properly equipped',
 cozinha_h:'You can actually <em>cook</em>', cozinha_lead:'This is a full kitchen, not just a place to reheat food.',
 cozinha_chips:'4-burner cooktop|Extractor hood|Frost-free fridge|Air fryer|Coffee maker|Food processor|Pressure cooker|Water purifier|Pots and pans|Full crockery|Wine glasses|Cutlery|Kitchen scale|Board and knives',
 cozinha_cook_t:'Cooktop and hood', cozinha_cook_b:'Turn the knob and hold it a few seconds until the flame settles. <strong>Always switch the hood on while cooking</strong> — the flat is open-plan and smells linger.',
 cozinha_agua_t:'Drinking water', cozinha_agua_b:'Use the <strong>purifier</strong> beside the sink. Tap water is treated, but the purifier tastes better and comes out cold.',
 cozinha_caf_t:'Coffee', cozinha_caf_b:'The coffee maker sits on the counter and the filters are in the upper cupboard. <strong>If the coffee runs out</strong>, message us on WhatsApp and we will bring more.',
 cozinha_n1:'Dirty dishes are fine, but please <strong>do not leave food in the sink or the fridge</strong> when you go — it attracts insects between bookings.',

 lazer_t:'Pool and facilities', lazer_s:'Rooftop, gym and more',
 lazer_h:'The building <em>facilities</em>', lazer_lead:'The rooftop has an infinity pool overlooking Parque Vaca Brava.',
 lazer_regra:'<strong>Building rule — read before going up.</strong> From <strong>Friday to Sunday</strong>, the pool and the gourmet area are open only to stays of <strong>three nights or more</strong>. Monday to Thursday there is no restriction. The gym and games room are open every day, no exceptions.',
 lazer_pisc_t:'Rooftop pool', lazer_pisc_b:'Infinity edge, with a deck and an open view. Sunset over Parque Vaca Brava is the best time of day. Bring a towel from the apartment — the pool does not provide them.',
 lazer_acad_t:'Gym', lazer_acad_b:'Open every day, with no minimum-stay rule. Please wear proper clothing and trainers.',
 lazer_jogos_t:'Games room', lazer_jogos_b:'Pool table and poker table. Open every day.',
 lazer_gour_t:'Gourmet area', lazer_gour_b:'With a barbecue. Same weekend rule as the pool.',
 lazer_n1:'<strong>Party hall:</strong> not available for short-stay guests, even for a fee.',
 lazer_n2:'These rules and opening hours belong to the building, not to aluGO — reception may ask you to confirm your booking on the way in.',

 lavar_t:'Washer dryer', lavar_s:'Leave with clean luggage',
 lavar_h:'The <em>washer dryer</em>', lavar_lead:'A Samsung unit in the utility area. It washes and dries in one cycle.',
 lavar_p_1:'Load the drum <strong>without packing it full</strong> — leave a hand span at the top, or it will not dry properly.',
 lavar_p_2:'Liquid detergent goes in the left drawer, fabric softener in the middle one (marked with a flower).',
 lavar_p_3:'Press the power button and pick a programme. For everyday loads, <strong>"Quick"</strong> is enough.',
 lavar_p_4:'To wash <strong>and</strong> dry, press the <strong>drying</strong> key before starting and choose the time.',
 lavar_p_5:'Tap <strong>Start</strong>. The door locks during the cycle and releases on its own at the end.',
 lavar_n1:'A full cycle with drying takes about <strong>3 hours</strong>. Plan around your check-out time.',
 lavar_n2:'<strong>Do not dry</strong> delicates, elastane or rubber-printed items — the dryer shrinks and peels them. When in doubt, use the drying rack.',

 regras_t:'House rules', regras_s:'What we agreed',
 regras_h:'What we <em>agreed</em>', regras_lead:'There are only a few, and they are all in the terms you signed.',
 regras_fumo:'<strong>No smoking anywhere indoors</strong> — that includes e-cigarettes, vapes and shisha, and the balconies too. The smell sets into fabric and plaster, and the deep clean is charged.',
 regras_si:'Have visitors during the day|Cook as much as you like|Use the gym and games room any day|Take a towel from the flat to the pool|Hang laundry in the utility area',
 regras_nao:'Smoking anywhere indoors|Parties or events|Pets|More than 3 guests|Noise after 10 pm|Moving furniture or decor around',
 m_fumo_t:'Smoking in the apartment', m_fumo_b:'<strong>R$ 300.00</strong> plus the cost of a full deep clean.',
 m_festa_t:'Party or event', m_festa_b:'<strong>R$ 500.00</strong> plus any damage and forfeiture of the remaining nights.',
 m_exc_t:'Guests over capacity', m_exc_b:'<strong>R$ 200.00</strong> per extra person. Capacity is 3 and reception controls it through the registration.',
 m_late_t:'Leaving after 12:00 pm', m_late_b:'<strong>R$ 200.00</strong> per hour. Another booking arrives the same day and cleaning starts on time.',
 regras_n1:'<strong>Quiet hours after 10 pm</strong> are a building regulation, not ours. A neighbour complaint becomes a formal warning to the owner.',

 problema_t:'Something wrong?', problema_s:'Fix it in a minute',
 problema_h:'Before you <em>call</em>', problema_lead:'Almost everything is solved here. If it is not, just tap the button at the bottom.',
 pb1_t:'Power is out', pb1_b:'First check whether it is only your flat: look out of the window and see if the neighbouring buildings still have lights. If it is only here, look for the <strong>breaker panel</strong> — usually high on the wall near the entrance or the utility area. Find the switch that has flipped down, turn them all off, switch that one back on first and then the rest. If it trips again when you plug something in, the appliance is the problem.',
 pb2_t:'No hot water in the shower', pb2_b:'The shower is electric. Check that the <strong>shower breaker</strong> is on in the panel. Then make sure the tap is fully open — with low pressure the heater will not fire. The "winter" setting heats more and reduces the flow.',
 pb3_t:'The air conditioning is not cooling', pb3_b:'Check it is on <strong>Cool</strong> mode (the snowflake) and not fan only. Set it to 23°C. Close the doors and windows. If it has run 20 minutes with no result, message us — it may be low on gas, which is our job to fix.',
 pb4_t:'Wi-Fi has dropped', pb4_b:'The router is in the living room, usually by the TV panel. <strong>Unplug it, count to 30 and plug it back in</strong> — it takes about 2 minutes to return. If your device still will not connect, try the <strong>Smart T 2.0</strong> network (password veiga4080), which reaches further.',
 pb5_t:'The lock will not open', pb5_b:'Type <strong>134679</strong> and then <strong>*</strong> — the asterisk is what confirms it. Five wrong tries lock it for a minute: wait and try again. If the screen will not light at all, the batteries may be flat — message us straight away and do not force the door.',
 pb6_t:'A leak or a blockage', pb6_b:'Close the nearest valve (under the sink or behind the toilet) and <strong>tell us immediately</strong>. Please do not use chemical drain cleaner — it can damage the pipes and the liability becomes yours.',
 problema_n1:'For gas, fire or lift emergencies, call <strong>reception on the intercom</strong> first — it is faster than any message.',
 problema_btn:'Message aluGO now',

 bairro_t:'Setor Bueno', bairro_s:'What is around',
 bairro_h:'The <em>neighbourhood</em>', bairro_lead:'You are at one of the best addresses in Goiânia — most things are within walking distance.',
 b_parque_t:'Parque Vaca Brava', b_parque_b:'About 10 minutes on foot. Walking track, a lake and a market on Sunday mornings. It is the same view you get from the pool.',
 b_rest_t:'Restaurants and bars', b_rest_b:'T-37 and Av. T-10 hold most of them. From breakfast to a late drink, all within a 10-minute walk.',
 b_merc_t:'Supermarket and pharmacy', b_merc_b:'There is a supermarket and a 24-hour pharmacy a few blocks away. For a big shop, delivery apps serve the building normally.',
 b_shop_t:'Shopping malls', b_shop_b:'Flamboyant and Bougainville are a few minutes away by car.',
 b_app_t:'Ride apps', b_app_b:'Uber and 99 cover the area very well, with short waits at any hour.',
 b_aero_t:'Airport and bus station', b_aero_b:'Santa Genoveva airport is roughly 20 to 30 minutes by car; the bus station about 15. Allow for late-afternoon traffic.',
 bairro_n1:'Want a restaurant recommendation for a particular occasion? Message us on WhatsApp — we know the area and will give you a real answer.',

 checkin_t:'Check-in and inspection', checkin_s:'Registration and arrival',
 checkin_h:'Online <em>check-in</em>', checkin_lead:'This is the registration that gets you past reception.',
 checkin_alerta:'<strong>Mandatory.</strong> Without it the front desk cannot register your face ID and will not let you upstairs. It is also a legal requirement for short-stay accommodation. It takes about 2 minutes.',
 checkin_btn:'Complete the online check-in',
 vist_intro:'When you arrive, take a quick walk around the flat. This <strong>protects you</strong>: anything reported now cannot be charged to you later.',
 vist_itens:'Walls, doors and furniture undamaged|Crockery, glasses and cutlery complete|Towels and linen in the closet|Air conditioning cooling in both rooms|TV, Wi-Fi and shower working|Nothing broken, stained or missing',
 vist_lbl:'Found anything out of place?',
 vist_ph:'e.g. mark on the wall next to the TV, chipped glass in the cupboard...',
 vist_btn:'Send the inspection',
 vist_n1:'<strong>Found nothing?</strong> No need to send anything. With no message in the first few hours, we take it that everything was in order.',

 saida_t:'Checking out', saida_s:'Let us know you left',
 saida_h:'Time to <em>go</em>', saida_lead:'Quick and simple — there is nothing to hand back at reception.',
 saida_hora:'Another booking arrives today and cleaning starts exactly at this time.',
 saida_itens:'Switch off both air conditioners and the lights|Close the windows and balcony doors|Take your food out of the fridge|Take the rubbish to the building bins|Check chargers, sockets and the closet drawers|Pull the door and confirm it locked',
 saida_lixo:'The bins are on the <strong>ground floor and basement levels 1 and 2</strong>, next to the lifts. Please do not leave bags in the corridor.',
 co_selo:'⚠ Before you leave',
 co_tit:'Confirm your check-out',
 co_desc:'This message is what releases our cleaning team to prepare the apartment. One tap — and your stay is recorded as closed.',
 co_btn:'Confirm my check-out',
 co_ok:'✓ Check-out registered. Safe travels!',
 co_pe:'No key or card to return. The lock closes by itself and the code is changed between bookings.',
 saida_n1:'Did everything go well? An honest review helps us enormously and takes under a minute. Thank you for choosing aluGO — we hope to host you again.'
},

 chegar_t:'Cómo llegar', chegar_s:'Dirección y mapa',
 chegar_h:'Dónde <em>estamos</em>', chegar_lead:'Torre B del DNA SmartStyle, en el corazón del Setor Bueno.',
 chegar_hor:'Entrada desde las <strong>15h</strong> · Salida hasta las <strong>12h</strong>',
 chegar_btn:'Abrir en Google Maps',
 chegar_n1:'<strong>El edificio tiene más de una torre.</strong> La tuya es la <strong>Torre B</strong> — el apartamento es el 1008 <strong>B</strong>. Dilo en portería para no subir a la torre equivocada.',
 chegar_n2:'Si vienes en app de transporte, pide que te deje en la entrada peatonal de la R. T-37. Los coches entran por la rampa lateral.',

 predio_t:'Entrar al edificio', predio_s:'Portería y facial',
 predio_h:'La <em>portería</em>', predio_lead:'Portería 24 horas. La primera entrada tiene un paso extra.',
 predio_alerta:'<strong>Sin el check-in online completado, la portería no autoriza la entrada.</strong> Es por ahí que tus datos llegan a recepción antes de tu llegada. Si aún no lo hiciste, hazlo ahora — son 2 minutos.',
 predio_p_1:'Llega a la portería y <strong>presenta un documento con foto</strong> (pasaporte o licencia).',
 predio_p_2:'Recepción verifica tu nombre en la lista del check-in online y <strong>registra tu reconocimiento facial ahí mismo</strong>.',
 predio_p_3:'A partir de ese momento entras y sales solo — <strong>tu rostro abre el molinete</strong>, sin tarjeta ni llave.',
 predio_p_4:'Toma el ascensor de la <strong>Torre B</strong> y sube al <strong>piso 10</strong>.',
 predio_n1:'Todos los huéspedes deben registrar el facial, incluso quien llegue después. Quien no figure en la lista del check-in online no será autorizado a subir.',
 predio_btn:'Ir al check-in online',

 apto_t:'Entrar al apartamento', apto_s:'Clave de la cerradura',
 apto_h:'La <em>clave</em> de la puerta', apto_lead:'Cerradura digital. No hay llave que retirar ni devolver.',
 apto_big:'incluido el asterisco final',
 apto_copiar:'Copiar la clave',
 apto_p_1:'<strong>Toca la pantalla</strong> de la cerradura para encender el teclado.',
 apto_p_2:'Marca <strong>134679</strong> y termina con <strong>*</strong> (asterisco).',
 apto_p_3:'La cerradura se destraba sola. <strong>Gira la manija y empuja.</strong>',
 apto_p_4:'Al salir la puerta se traba sola — pero <strong>verifica siempre que quedó cerrada</strong>.',
 apto_n1:'Si la pantalla no enciende, apoya la palma sobre ella un segundo. El sensor necesita detectar el toque antes de mostrar el teclado.',
 apto_n2:'Equivocarse varias veces seguidas <strong>bloquea la cerradura por 1 minuto</strong>. Si pasa, espera y marca de nuevo con calma — no fuerces la puerta.',

 casa_t:'El apartamento', casa_s:'Ambientes y comodidades',
 casa_h:'El <em>apartamento</em>', casa_lead:'Un dormitorio, para hasta 3 personas.',
 casa_sala_t:'Sala y comedor', casa_sala_b:'Sofá esquinero que <strong>se convierte en cama individual</strong>, mesa para 4, TV grande con streaming y cortina blackout. El aire de la sala es independiente del dormitorio.',
 casa_quarto_t:'Dormitorio', casa_quarto_b:'Cama matrimonial, closet con puertas espejadas, una barra que sirve de escritorio y aire acondicionado propio. La luz de la pared tiene interruptor al lado de la cama.',
 casa_banho_t:'Baño', casa_banho_b:'Box de vidrio, ducha, mesada de granito y espejo iluminado. <strong>Las toallas y la ropa de cama ya están en el armario</strong>, listas para usar.',
 casa_varanda_t:'Balcones', casa_varanda_b:'Son dos: uno lateral y otro con vista abierta a la ciudad. El Wi-Fi 2.0 llega mejor afuera que el 5.0.',
 casa_220:'Todos los enchufes son de <strong>220V</strong>, el estándar de Goiás. Revisa el secador, la planchita y los cargadores antes de conectarlos.',
 casa_tv_t:'TV y streaming', casa_tv_b:'La TV ya tiene sesión iniciada en Netflix. Usa el control de la propia TV — la app abre en la pantalla inicial. <strong>No cierres la sesión</strong> al irte.',
 casa_ar_t:'Aire acondicionado', casa_ar_b:'Cada ambiente tiene el suyo, con control propio. Mantén <strong>puertas y ventanas cerradas</strong> mientras funciona y apágalo al salir del apartamento.',
 casa_lixo_t:'Dónde tirar la basura', casa_lixo_b:'Los contenedores están en la <strong>planta baja y en los subsuelos 1 y 2</strong>, siempre cerca de los ascensores. No dejes bolsas en el pasillo ni en la puerta.',
 casa_n1:'¿Falta algo — una toalla extra, una manta, una almohada? Escríbenos por WhatsApp y lo llevamos el mismo día.',

 cozinha_t:'Cocina', cozinha_s:'Realmente equipada',
 cozinha_h:'Se puede <em>cocinar</em>', cozinha_lead:'La cocina es completa, no es solo para calentar comida.',
 cozinha_chips:'Anafe de 4 hornallas|Campana|Heladera no frost|Freidora de aire|Cafetera|Procesadora|Olla a presión|Purificador de agua|Ollas|Vajilla completa|Copas|Cubiertos|Balanza|Tabla y cuchillos',
 cozinha_cook_t:'Anafe y campana', cozinha_cook_b:'Gira la perilla y sostenla unos segundos hasta que la llama se estabilice. <strong>Enciende la campana siempre que cocines</strong> — el apartamento es integrado y el olor queda.',
 cozinha_agua_t:'Agua para beber', cozinha_agua_b:'Usa el <strong>purificador</strong> al lado de la pileta. El agua de la canilla es tratada, pero el purificador sabe mejor y sale fría.',
 cozinha_caf_t:'Café', cozinha_caf_b:'La cafetera está en la mesada y los filtros en el armario superior. <strong>Si falta café molido</strong>, avísanos por WhatsApp y lo llevamos.',
 cozinha_n1:'La vajilla sucia no es problema, pero te pedimos que <strong>no dejes comida en la pileta ni en la heladera</strong> al irte — atrae insectos entre una reserva y otra.',

 lazer_t:'Piscina y ocio', lazer_s:'Rooftop, gimnasio y más',
 lazer_h:'Las <em>áreas</em> del edificio', lazer_lead:'El rooftop tiene piscina infinita con vista al Parque Vaca Brava.',
 lazer_regra:'<strong>Regla del edificio — léela antes de bajar.</strong> De <strong>viernes a domingo</strong>, la piscina y el espacio gourmet se habilitan solo para estadías de <strong>tres noches o más</strong>. De lunes a jueves no hay restricción. El gimnasio y el salón de juegos están habilitados todos los días, sin excepción.',
 lazer_pisc_t:'Piscina en el rooftop', lazer_pisc_b:'Borde infinito, con deck y vista abierta. El atardecer sobre el Parque Vaca Brava es el mejor momento. Lleva tu toalla del apartamento — la piscina no las provee.',
 lazer_acad_t:'Gimnasio', lazer_acad_b:'Habilitado todos los días, sin restricción de estadía. Usa ropa y calzado adecuados.',
 lazer_jogos_t:'Salón de juegos', lazer_jogos_b:'Mesa de billar y de póker. Habilitado todos los días.',
 lazer_gour_t:'Espacio gourmet', lazer_gour_b:'Con parrilla. Sigue la misma regla de la piscina el fin de semana.',
 lazer_n1:'<strong>Salón de fiestas:</strong> no se habilita para hospedaje por temporada, ni siquiera pagando.',
 lazer_n2:'Estas reglas y horarios son del edificio, no de aluGO — la portería puede pedir la confirmación de tu reserva al entrar.',

 lavar_t:'Lavasecarropas', lavar_s:'Irte con la valija limpia',
 lavar_h:'El <em>lavasecarropas</em>', lavar_lead:'Samsung, en el área de servicio. Lava y seca en el mismo ciclo.',
 lavar_p_1:'Carga el tambor <strong>sin llenarlo del todo</strong> — deja un palmo libre arriba, si no, no seca bien.',
 lavar_p_2:'El jabón líquido va en el cajón izquierdo y el suavizante en el del medio (el de la flor).',
 lavar_p_3:'Enciende con el botón de energía y elige el programa. Para el día a día, <strong>"Rápido"</strong> alcanza.',
 lavar_p_4:'Para lavar <strong>y</strong> secar, presiona la tecla de <strong>secado</strong> antes de iniciar y elige el tiempo.',
 lavar_p_5:'Toca <strong>Iniciar</strong>. La puerta se traba durante el ciclo y se destraba sola al final.',
 lavar_n1:'Un ciclo completo con secado tarda cerca de <strong>3 horas</strong>. Prográmalo pensando en tu horario de salida.',
 lavar_n2:'<strong>No seques</strong> prendas delicadas, con elastano o estampa de goma — la secadora las encoge y las despega. Ante la duda, usa el tendedero.',

 regras_t:'Reglas de la casa', regras_s:'Lo acordado',
 regras_h:'Lo <em>acordado</em>', regras_lead:'Son pocas y todas están en el término que firmaste.',
 regras_fumo:'<strong>Prohibido fumar en cualquier ambiente interno</strong> — incluye cigarrillo electrónico, vape y narguile, también en los balcones. El olor impregna la tela y el revoque, y la higienización se cobra.',
 regras_si:'Recibir visitas durante el día|Cocinar a gusto|Usar gimnasio y salón de juegos todos los días|Llevar tu toalla a la piscina|Tender ropa en el área de servicio',
 regras_nao:'Fumar en cualquier ambiente|Fiestas o eventos|Mascotas|Superar los 3 huéspedes|Ruido después de las 22h|Mover muebles o decoración de lugar',
 m_fumo_t:'Fumar en el apartamento', m_fumo_b:'<strong>R$ 300,00</strong> más el costo de la higienización completa del ambiente.',
 m_festa_t:'Fiesta o evento', m_festa_b:'<strong>R$ 500,00</strong> más la reparación de daños y la pérdida de las noches restantes.',
 m_exc_t:'Huésped fuera de capacidad', m_exc_b:'<strong>R$ 200,00</strong> por persona excedente. La capacidad es de 3 y la portería lo controla por el registro.',
 m_late_t:'Salida después de las 12h', m_late_b:'<strong>R$ 200,00</strong> por hora. Hay una reserva llegando el mismo día y la limpieza entra puntual.',
 regras_n1:'<strong>El silencio después de las 22h</strong> es reglamento del edificio, no regla nuestra. Un reclamo de vecino se convierte en advertencia formal al propietario.',

 problema_t:'¿Algún problema?', problema_s:'Resuélvelo en 1 minuto',
 problema_h:'Antes de <em>llamar</em>', problema_lead:'Casi todo se resuelve aquí. Si no, toca el botón del final.',
 pb1_t:'Se cortó la luz', pb1_b:'Primero fíjate si es solo tu apartamento: mira por la ventana si los edificios vecinos tienen luz. Si es solo aquí, busca el <strong>tablero de disyuntores</strong> — suele estar en la parte alta de la pared, cerca de la entrada o del área de servicio. Encuentra la llave que quedó abajo, apaga todas, vuelve a encender esa primero y después las demás. Si vuelve a saltar al enchufar algo, el problema es ese aparato.',
 pb2_t:'La ducha sale fría', pb2_b:'La ducha es eléctrica. Verifica que el <strong>disyuntor de la ducha</strong> esté encendido en el tablero. Después fíjate que la llave de paso esté completamente abierta — con poca presión el calentador no enciende. La posición "invierno" calienta más y reduce el caudal.',
 pb3_t:'El aire no enfría', pb3_b:'Verifica que esté en modo <strong>Cool / Frío</strong> (el copo de nieve) y no en ventilación. Ponlo en 23°C. Cierra puertas y ventanas. Si pasan 20 minutos y no enfría, escríbenos — puede faltar gas y el mantenimiento es nuestro.',
 pb4_t:'Se cayó el Wi-Fi', pb4_b:'El router está en la sala, normalmente junto al panel de la TV. <strong>Desenchúfalo, cuenta hasta 30 y vuelve a enchufarlo</strong> — tarda unos 2 minutos en volver. Si tu equipo sigue sin conectar, prueba la red <strong>Smart T 2.0</strong> (clave veiga4080), que llega más lejos.',
 pb5_t:'La cerradura no abre', pb5_b:'Marca <strong>134679</strong> y después el <strong>*</strong> — el asterisco es lo que confirma. Si te equivocas 5 veces se bloquea por un minuto: espera e intenta de nuevo. Si la pantalla ni enciende, pueden haberse agotado las pilas — escríbenos enseguida y no fuerces la puerta.',
 pb6_t:'Pérdida de agua o cañería tapada', pb6_b:'Cierra la llave de paso más cercana (debajo de la pileta o detrás del inodoro) y <strong>avísanos en el momento</strong>. No uses destapador químico — puede dañar la cañería y la responsabilidad pasa a ser tuya.',
 problema_n1:'Emergencia de gas, incendio o ascensor: llama primero a la <strong>portería por el intercomunicador</strong>, es más rápido que cualquier mensaje.',
 problema_btn:'Hablar con aluGO ahora',

 bairro_t:'Setor Bueno', bairro_s:'Qué hay cerca',
 bairro_h:'El <em>barrio</em>', bairro_lead:'Estás en una de las mejores direcciones de Goiânia — casi todo se resuelve caminando.',
 b_parque_t:'Parque Vaca Brava', b_parque_b:'A unos 10 minutos a pie. Pista de caminata, lago y feria los domingos por la mañana. Es la misma vista que se ve desde la piscina.',
 b_rest_t:'Restaurantes y bares', b_rest_b:'La T-37 y la Av. T-10 concentran la mayoría. Del desayuno al bar de la noche, todo en un radio de 10 minutos a pie.',
 b_merc_t:'Supermercado y farmacia', b_merc_b:'Hay supermercado y farmacia 24 horas a pocas cuadras. Para una compra grande, las apps de delivery llegan al edificio sin problema.',
 b_shop_t:'Centros comerciales', b_shop_b:'Flamboyant y Bougainville quedan a pocos minutos en auto.',
 b_app_t:'Apps de transporte', b_app_b:'Uber y 99 cubren muy bien la zona, con esperas cortas a cualquier hora.',
 b_aero_t:'Aeropuerto y terminal', b_aero_b:'El aeropuerto Santa Genoveva queda a unos 20 a 30 minutos en auto; la terminal de ómnibus, a unos 15. Considera el tránsito de la tarde.',
 bairro_n1:'¿Quieres una recomendación de restaurante para una ocasión especial? Escríbenos por WhatsApp — conocemos el barrio y recomendamos de verdad.',

 checkin_t:'Check-in e inspección', checkin_s:'Registro y llegada',
 checkin_h:'Check-in <em>online</em>', checkin_lead:'Es el registro que habilita tu entrada en la portería.',
 checkin_alerta:'<strong>Obligatorio.</strong> Sin él, recepción no registra el reconocimiento facial y no autoriza tu subida. Además, es una exigencia legal para el hospedaje por temporada. Toma unos 2 minutos.',
 checkin_btn:'Completar el check-in online',
 vist_intro:'Al llegar, date una vuelta rápida por el apartamento. Esto <strong>te protege</strong>: lo que se registre ahora no puede cobrarse después.',
 vist_itens:'Paredes, puertas y muebles sin daños|Vajilla, copas y cubiertos completos|Toallas y ropa de cama en el armario|Aire acondicionado enfriando en los dos ambientes|TV, Wi-Fi y ducha funcionando|Nada roto, manchado ni faltante',
 vist_lbl:'¿Encontraste algo fuera de lugar?',
 vist_ph:'Ej.: mancha en la pared al lado de la TV, copa rajada en el armario...',
 vist_btn:'Enviar la inspección',
 vist_n1:'<strong>¿No encontraste nada?</strong> No hace falta enviar nada. Sin mensaje en las primeras horas, entendemos que todo estaba en orden.',

 saida_t:'Irse', saida_s:'Avisa tu check-out',
 saida_h:'Hora de <em>irse</em>', saida_lead:'Rápido y sin trámites — no hay nada que devolver en recepción.',
 saida_hora:'Hay una reserva llegando hoy y la limpieza entra puntualmente a esa hora.',
 saida_itens:'Apagar los dos aires acondicionados y las luces|Cerrar las ventanas y las puertas de los balcones|Retirar la comida de la heladera|Llevar la basura a los contenedores del edificio|Revisar cargadores, enchufes y los cajones del closet|Tirar de la puerta y confirmar que trabó',
 saida_lixo:'Los contenedores están en la <strong>planta baja y en los subsuelos 1 y 2</strong>, cerca de los ascensores. No dejes bolsas en el pasillo.',
 co_selo:'⚠ Antes de irte',
 co_tit:'Confirma tu check-out',
 co_desc:'Este aviso es lo que libera a nuestro equipo de limpieza para preparar el apartamento. Un solo toque — y tu estadía queda registrada como cerrada.',
 co_btn:'Avisar mi check-out',
 co_ok:'✓ Check-out registrado. ¡Buen viaje!',
 co_pe:'No hay llave ni tarjeta que devolver. La cerradura traba sola y la clave se cambia entre reservas.',
 saida_n1:'¿Salió todo bien? Una reseña sincera nos ayuda muchísimo y toma menos de un minuto. Gracias por elegir aluGO — esperamos recibirte de nuevo.'
}

var L = (function(){ try{ var s=localStorage.getItem('alugo_lang'); if(s) return s; }catch(e){}
  var n=(navigator.language||'pt').slice(0,2).toLowerCase();
  return (n==='en'||n==='es')?n:'pt'; })();

function t(k){ var d=I18N[L]||I18N.pt; return (d[k]!==undefined)?d[k]:(I18N.pt[k]||''); }
function setLang(l){ L=l; try{localStorage.setItem('alugo_lang',l);}catch(e){}
  document.documentElement.lang = l==='pt'?'pt-BR':l;
  document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.dataset.l===l); });
  document.querySelectorAll('[data-t]').forEach(function(e){ e.textContent = t(e.dataset.t); });
  var q=document.getElementById('q'); if(q) q.placeholder = t(q.dataset.ph);
  montarGrade(); if(atual) abrir(atual, true); buscar();
}

/* ═══ GRADE ═══ */
function montarGrade(){
  var g=document.getElementById('grid'); g.innerHTML='';
  TELAS.forEach(function(s,i){
    var b=document.createElement('button');
    b.className='tile'+(s.alerta?' alerta':'')+(s.saida?' saida':'');
    b.onclick=function(){ abrir(s.id); };
    b.innerHTML = (s.saida?'':'<span class="tile-n">'+String(i+1).padStart(2,'0')+'</span>')+
      s.icone+'<div><div class="tile-t">'+t(s.id+'_t')+'</div><div class="tile-s">'+t(s.id+'_s')+'</div></div>';
    g.appendChild(b);
  });
}

/* ═══ TELA ═══ */
var atual=null;
function abrir(id, silencioso){
  var s=TELAS.filter(function(x){return x.id===id;})[0]; if(!s) return;
  atual=id;
  document.getElementById('scTtl').textContent = t(id+'_t');
  document.getElementById('scBody').innerHTML = s.corpo();
  var el=document.getElementById('screen'); el.scrollTop=0; el.classList.add('on');
  if(!silencioso) document.body.style.overflow='hidden';
}
function fechar(){ document.getElementById('screen').classList.remove('on'); document.body.style.overflow=''; atual=null; }

/* ═══ WHATSAPP · webview-safe ═══ */
function abrirWhats(url){
  var app=url.replace('https://wa.me/','whatsapp://send?phone=').replace('?text=','&text=');
  var tm=setTimeout(function(){ if(!document.hidden) window.location.href=url; },1500);
  document.addEventListener('visibilitychange',function h(){ if(document.hidden){clearTimeout(tm);document.removeEventListener('visibilitychange',h);} });
  window.location.href=app;
}
function wpp(){ abrirWhats('https://wa.me/'+WPP+'?text='+encodeURIComponent(t('wpp_msg'))); }

/* ═══ CHECK-OUT ═══ */
function avisarCheckout(){
  try{ fetch(API,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:TOKEN,unidade:UNIDADE})}).catch(function(){}); }catch(e){}
  var d=document.getElementById('coDone'); if(d) d.classList.add('on');
  var m='🚪 *CHECK-OUT*\n━━━━━━━━━━━━━━\n\n🏢 '+UNIDADE_N+'\n🔖 '+UNIDADE+'\n\n'+t('co_msg')+'\n\n_'+t('co_msg2')+'_';
  setTimeout(function(){ abrirWhats('https://wa.me/'+WPP+'?text='+encodeURIComponent(m)); },350);
}
/* ═══ VISTORIA ═══ */
function enviarVistoria(){
  var c=document.getElementById('vist'), v=c?c.value.trim():'';
  if(!v){ alert(t('vist_vazio')); return; }
  var m='🔍 *'+t('vist_tit')+'*\n━━━━━━━━━━━━━━\n\n🏢 '+UNIDADE_N+'\n🔖 '+UNIDADE+'\n\n'+v+'\n\n_'+t('vist_rodape')+'_';
  abrirWhats('https://wa.me/'+WPP+'?text='+encodeURIComponent(m));
}
/* ═══ COPIAR ═══ */
function copiar(txt,el){
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).catch(function(){
    var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta);
  });
  if(!el) return;
  var tag=el.querySelector('.ins-tag'); el.classList.add('copied');
  if(tag){ var o=tag.textContent; tag.textContent=t('copiado');
    setTimeout(function(){ tag.textContent=o; el.classList.remove('copied'); },1800); }
}
function toggleCheck(e){ e.classList.toggle('done'); }
function toggleAcc(e){ e.parentElement.classList.toggle('on'); }

/* ═══ BUSCA ═══ */
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function buscar(){
  var q=document.getElementById('q').value.trim(), box=document.getElementById('res');
  if(q.length<2){ box.classList.remove('on'); box.innerHTML=''; return; }
  var nq=norm(q), hits=[];
  TELAS.forEach(function(s){
    var sc=0, tt=norm(t(s.id+'_t')), ss=norm(t(s.id+'_s')), kw=(SINONIMOS[L][s.id]||[]).map(norm);
    if(tt.indexOf(nq)!==-1) sc+=50;
    if(ss.indexOf(nq)!==-1) sc+=20;
    kw.forEach(function(k){ if(k.indexOf(nq)!==-1||nq.indexOf(k)!==-1) sc+=14; });
    if(sc>0) hits.push({s:s,sc:sc});
  });
  hits.sort(function(a,b){return b.sc-a.sc;});
  if(!hits.length){ box.innerHTML='<div class="res-empty">'+t('nada')+'</div>'; box.classList.add('on'); return; }
  box.innerHTML = hits.slice(0,6).map(function(h){
    return '<div class="res" onclick="abrir(\''+h.s.id+'\')">'+h.s.icone+
      '<div><div class="res-t">'+t(h.s.id+'_t')+'</div><div class="res-s">'+t(h.s.id+'_s')+'</div></div></div>';
  }).join('');
  box.classList.add('on');
}

/* ═══ INIT ═══ */
document.querySelectorAll('.lang button').forEach(function(b){ b.onclick=function(){ setLang(b.dataset.l); }; });
document.getElementById('q').addEventListener('input', buscar);
document.addEventListener('keydown', function(e){ if(e.key==='Escape') fechar(); });
setLang(L);
</script>
